<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Kasaba Gecesi</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Giriş sayfası koyu panel; oyun ve lobi tam ekran köy sahnesi. Tüm oyun arayüzü sahnenin içinde kaplama olarak durur. */
:root{
  --bg:#0f1226; --panel:#181c3a; --panel2:#20254a; --line:#2f3566;
  --fg:#eef0ff; --muted:#9aa0c9; --accent:#ffb347; --accent-ink:#2a1700;
  --inn:#5aa9ff; --imp:#ff5c5c; --neu:#c08cff; --danger:#ff6b6b;
  --ink:#3a2f1c; --paper:#fbf6ea; --orange:#e8842a;
  --display:"Nunito","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body.landing{padding:12px 16px 32px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
h1{font-size:30px;font-weight:900}
h2{font-size:18px;font-weight:800}
h3{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:9px 14px;min-height:40px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
input,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.moon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3d6,var(--accent) 60%,#8a5a12);box-shadow:0 0 24px rgba(255,179,71,.45)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.setup{display:grid;gap:6px}
.setup .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--panel2)}
.setup .r .n{font-weight:700;font-size:14px}.setup .r .d{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--panel2)}
.chip .dot{width:8px;height:8px;border-radius:50%}
/* giriş sayfası geçmiş bloğu (Plan 5) */
.hesap-form{display:grid;gap:8px;max-width:440px;margin-top:4px}.hesap-form h3{margin-top:4px}.hesap-form input{max-width:320px}.hesap-hata{color:#ff6b6b;font-size:13px}.hesap-birlestir{display:grid;gap:6px}.hesap-durum{margin:0}
.endcard a.hesap-hatirlat{display:inline-block;justify-self:center;font-weight:700;color:#8a5a12;font-size:clamp(11px,1.4vw,13px)}
.gecmis .kart{font-weight:700}.gecmis .maclar{display:grid;gap:6px}
.gecmis a.mac{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--panel2);color:var(--fg);text-decoration:none;font-size:14px}.gecmis a.mac:hover{outline:1px solid var(--accent)}
.gecmis a.mac .ne{font-size:12px;color:var(--muted)}.gecmis a.mac .alt{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}.gecmis a.mac .kim{font-weight:800}.gecmis a.mac .kim.inn{color:var(--inn)}.gecmis a.mac .kim.imp{color:var(--imp)}.gecmis a.mac .kim.neu{color:var(--neu)}.gecmis a.mac .ben{font-size:13px;color:var(--muted)}
.gecmis a.kasaba{color:var(--fg);text-decoration:none}
.endcard a.hikaye{display:inline-block;justify-self:center;font-weight:800;color:#1e3a8a;font-size:clamp(12px,1.5vw,15px)}
.dot.inn{background:var(--inn)}.dot.imp{background:var(--imp)}.dot.neu{background:var(--neu)}

/* ---------- Sahne ---------- */
.stage{position:fixed;inset:0;background:#6aa844;overflow:hidden;font-family:var(--body)}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%}
.stage .bean{transition:transform 1s cubic-bezier(.4,0,.2,1),opacity .5s}
.stage .bean .hop{transform-box:fill-box;transform-origin:50% 100%}
.stage .bean.walking .hop{animation:walkhop .22s ease-in-out infinite alternate}
.btag text{font-size:10px;font-weight:900;font-family:Nunito,system-ui,sans-serif}
/* rol hareketleri (gece, yalnız hamleyi yapan görür) */
.rol-fx .sway{transform-box:fill-box;transform-origin:20% 80%;animation:fxsway .32s ease-in-out 3 alternate}
@keyframes fxsway{0%{transform:rotate(-35deg)}100%{transform:rotate(40deg)}}
.rol-fx .pulse{animation:fxpulse .5s ease-in-out 2 alternate}
@keyframes fxpulse{0%{opacity:.3;transform:scale(.8)}100%{opacity:1;transform:scale(1.15)}}
.rol-fx .look{animation:fxlook .5s ease-in-out 2 alternate}
@keyframes fxlook{0%{transform:translateX(-6px)}100%{transform:translateX(6px)}}
.rol-fx .flash{animation:fxflash 1s ease-out 1 forwards}
@keyframes fxflash{0%{opacity:0;transform:scale(.2)}15%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.rol-fx .snap{transform-box:fill-box;transform-origin:50% 100%;animation:fxsnap .25s ease-in 2 alternate}
@keyframes fxsnap{0%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
.rol-fx .flicker{animation:fxflicker .12s ease-in-out infinite alternate}
@keyframes fxflicker{0%{opacity:.7;transform:scaleY(.9)}100%{opacity:1;transform:scaleY(1.1)}}
.rol-fx .rise{animation:fxrise 1s ease-out 1 forwards}
@keyframes fxrise{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.rol-fx .bolt{animation:fxbolt .9s ease-out 1 forwards}
@keyframes fxbolt{0%{opacity:0}10%{opacity:1}60%{opacity:1}100%{opacity:0}}
.rol-fx .steps>*{opacity:0;animation:fxstep .3s ease-out forwards}
.rol-fx .steps>*:nth-child(2){animation-delay:.3s}.rol-fx .steps>*:nth-child(3){animation-delay:.6s}
@keyframes fxstep{to{opacity:.9}}
@keyframes walkhop{0%{transform:translateY(0) scaleY(1)}100%{transform:translateY(-7px) scaleY(1.06)}}
.stage .bean.landed .hop{animation:land .35s ease-out}
@keyframes land{0%{transform:scaleY(.85) scaleX(1.12)}60%{transform:scaleY(1.06) scaleX(.96)}100%{transform:scaleY(1) scaleX(1)}}
.stage .bean.enter .hop{animation:enter .7s ease-in forwards}
@keyframes enter{0%{transform:scale(1) translateY(0);opacity:1}100%{transform:scale(.5) translateY(-22px);opacity:0}}
.stage .collapse{transform-box:fill-box;transform-origin:50% 100%;animation:collapse .8s cubic-bezier(.3,0,.6,1) forwards}
@keyframes collapse{0%{transform:rotate(0)}35%{transform:rotate(-8deg) translateY(-6px)}100%{transform:rotate(-80deg) translateY(10px)}}
.stage .idle .hop{animation:breathe 2.6s ease-in-out infinite}
.stage .launch{animation:launch 1.6s cubic-bezier(.3,0,.7,.2) forwards}
@keyframes launch{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(420px,-900px) rotate(720deg)}}
.stage .pad .plate{transform-box:fill-box;transform-origin:50% 100%}
.stage .pad.press .plate{animation:press .5s ease-in forwards}
@keyframes press{0%{transform:translateY(0)}100%{transform:translateY(14px)}}
.stage .pad.fire .plate{animation:fire .25s ease-out forwards}
@keyframes fire{0%{transform:translateY(14px)}100%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
.stage .bean.fast{transition:transform .6s ease-out,opacity .3s}
.stage .nightlayer{transition:opacity 1.6s}
.stage .fade{transition:opacity .6s}
.stage .bubble{animation:bubble 6s forwards}
@keyframes bubble{0%,70%{opacity:1}100%{opacity:0}}
.stage .plus{animation:plus 1.6s ease-out infinite}
@keyframes plus{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.stage .bolt{animation:bolt .9s steps(1) 3}
@keyframes bolt{0%,100%{opacity:1}50%{opacity:0}}
.stage .shake{animation:shake .5s 3}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.stage .smoke{animation:smoke 2.5s ease-out forwards}
@keyframes smoke{0%{opacity:.9;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-70px) scale(1.6)}}
.stage .ghost{animation:ghost 2.4s ease-in-out infinite}
@keyframes ghost{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ov{position:absolute;z-index:2;font-family:var(--body);color:var(--ink)}
.pill{background:rgba(255,255,255,.78);border-radius:10px;padding:4px 12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.rolebar{top:10px;left:10px;display:flex;gap:3px;background:rgba(255,255,255,.55);padding:4px;border-radius:9px;max-width:60vw}
.rolebar .r{width:clamp(20px,3vw,32px);height:clamp(20px,3vw,32px);flex:none;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:clamp(11px,1.7vw,18px);font-weight:900;color:#7a6a55;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.rolebar .r i{position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%}
.timerbox{top:10px;right:106px;background:rgba(255,255,255,.78);border-radius:10px;padding:2px 12px;display:flex;align-items:center;gap:8px;font-weight:900;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.timerbox .timer{font-family:var(--display);font-size:clamp(17px,2.6vw,28px);font-variant-numeric:tabular-nums}
.timerbox small{font-size:clamp(9px,1.1vw,12px);font-weight:700;color:#7a6a55}
.gear{top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.78);display:grid;place-items:center;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.12);cursor:pointer;border:0;min-height:0;padding:0}
.menu{top:56px;right:10px;background:rgba(255,255,255,.96);border-radius:12px;padding:6px;display:grid;gap:4px;min-width:200px;max-width:min(92vw,420px);max-height:calc(100vh - 70px);overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.3);font-size:14px;font-weight:700;z-index:5}
.menu button{border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 10px;border-radius:8px;min-height:0;font-weight:700}
.menu button:hover{background:#f1e6cc}
.menu button.d{color:#b3202a}
.menu .h{font-size:11px;color:#7a6a55;letter-spacing:.08em;padding:4px 10px 0}
.menu label{display:grid;gap:3px;font-size:12px;color:#7a6a55;padding:4px 10px}
.menu input{background:#fff;color:var(--ink);border:1px solid #d9c9a6;min-height:34px;padding:5px 8px}
.hint{top:54px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.42);color:#fff;font-size:clamp(10px,1.3vw,13px);padding:4px 12px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.box{top:54px;left:50%;transform:translateX(-50%);background:rgba(20,10,30,.88);color:#fff;border-radius:14px;padding:10px 18px;text-align:center;border:2px solid var(--accent);font-size:clamp(11px,1.4vw,14px);max-width:92vw;z-index:4}
.box .t{font-family:var(--display);font-size:clamp(14px,2vw,19px);font-weight:900}
.box.center{top:50%;transform:translate(-50%,-50%);padding:18px 24px;min-width:min(92vw,360px)}
.box .ok{margin-top:10px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;padding:8px 22px;min-height:0}
.chat{left:10px;bottom:10px;width:min(300px,46vw);display:grid;gap:6px;z-index:3}
.chat .log{display:grid;gap:3px;max-height:34vh;overflow-y:auto;scrollbar-width:none}
.chat .log div{display:flex;align-items:flex-start;gap:6px;background:rgba(0,0,0,.4);color:#fff;font-size:clamp(10px,1.3vw,12px);padding:4px 9px 4px 4px;border-radius:12px;width:fit-content;max-width:100%;backdrop-filter:blur(2px)}
.chat .log div.sys{background:rgba(255,179,71,.4);color:#fff3d6}
.chat .log div.dead{background:rgba(120,90,200,.45)}
.chat b{width:14px;height:14px;border-radius:50%;flex:none;margin-top:2px}
.chat .in{display:flex;gap:6px}
.chat .log div.hizli{background:rgba(255,215,102,.38)}
.chat .in button.hizli{order:-1;flex:0 0 auto;width:auto;min-width:44px;padding:4px 8px;background:#ffd766;color:#3a2f1c;border:0;border-radius:10px;font-weight:800}
.hizli-uyari{background:rgba(226,59,59,.85);color:#fff;font-size:clamp(10px,1.3vw,12px);padding:3px 9px;border-radius:8px;font-weight:700}
.hizli-panel{left:10px;bottom:52px;width:min(320px,52vw);background:rgba(255,255,255,.97);border-radius:14px;padding:8px;display:grid;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:7;max-height:60vh;overflow:auto}
.hizli-panel .ust{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink)}.hizli-panel .kapat{padding:2px 8px;min-height:0;background:transparent;color:var(--ink);border:1px solid #d9c9a6;border-radius:8px}
.hizli-panel button.secenek{text-align:left;background:#f6efe0;color:var(--ink);border:0;border-radius:10px;padding:7px 10px;font-size:clamp(11px,1.4vw,13px);font-weight:700}
.hizli-panel .roller{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.hizli-panel .roller button{background:#f6efe0;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:5px 6px;font-size:clamp(10px,1.2vw,12px);font-weight:700;text-align:left;min-height:0}
.rehber-dugme{right:60px;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:0;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.12);padding:0;min-height:0;z-index:4}
.rehber{right:0;top:0;bottom:0;width:min(380px,52vw);background:rgba(255,255,255,.97);overflow:auto;padding:10px 12px 14px;z-index:8;box-shadow:-8px 0 30px rgba(0,0,0,.3);font-size:clamp(11px,1.3vw,13px);scrollbar-width:thin}
.rehber .ust{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rehber .kapat{padding:2px 9px;min-height:0;background:transparent;color:var(--ink);border:1px solid #d9c9a6;border-radius:8px}
.rehber h3{font-family:var(--display);font-size:13px;margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.rehber .rol{background:#f6efe0;border-left:4px solid #999;border-radius:8px;padding:5px 8px;margin:4px 0}.rehber .rol.inn{border-color:#2fb55a}.rehber .rol.imp{border-color:#e23b3b}.rehber .rol.neu{border-color:#8e4bff}
.rehber .rol .d{margin-top:2px}.rehber .rol .ip{margin-top:2px;opacity:.8;font-style:italic;font-size:.92em}
.hizli-panel .roller button.inn{border-color:#2fb55a}.hizli-panel .roller button.imp{border-color:#e23b3b}.hizli-panel .roller button.neu{border-color:#8e4bff}
.chat input{flex:1;border:0;border-radius:10px;padding:8px 12px;font-size:clamp(12px,1.4vw,14px);background:rgba(255,255,255,.92);color:var(--ink);min-height:0}
.chat .in button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;padding:0 14px;min-height:0}
.mine{right:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border-radius:12px;padding:6px 10px;font-size:clamp(10px,1.3vw,13px);box-shadow:0 2px 0 rgba(0,0,0,.12);max-width:44vw;cursor:pointer;border:0;min-height:0;color:var(--ink);text-align:left}
.mine .ic{font-size:clamp(18px,2.6vw,26px)}
.mine b{display:block;font-family:var(--display);font-size:clamp(12px,1.6vw,16px)}
.mine .team{font-size:9px;letter-spacing:.1em;font-weight:900}
.notesbtn{right:10px;bottom:66px;background:rgba(255,255,255,.88);border-radius:12px;padding:6px 10px;font-weight:800;font-size:clamp(10px,1.2vw,13px);box-shadow:0 2px 0 rgba(0,0,0,.12);border:0;min-height:0;color:var(--ink)}
.notes{right:10px;bottom:104px;width:min(280px,60vw);background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;font-size:clamp(10px,1.2vw,12px);box-shadow:0 8px 20px rgba(0,0,0,.3);max-height:40vh;overflow:auto;z-index:4}
.notes .h{font-weight:900;font-size:11px;letter-spacing:.08em;color:#7a6a55;margin-bottom:4px}
.notes div.n{padding:3px 0;border-top:1px solid #eee}
.act{left:10px;bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:60vw;z-index:3}
.act button{border:0;border-radius:12px;padding:7px 12px;font-weight:800;font-size:clamp(11px,1.4vw,14px);background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);min-height:0}
.act button.on{background:#e23b3b;color:#fff;box-shadow:0 3px 0 #8f1f1f}
.act button.ab.on{background:#2563eb;box-shadow:0 3px 0 #1e3a8a}
.skip{right:56px;top:54px;border:0;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:900;font-family:var(--display);font-size:clamp(13px,1.8vw,18px);padding:7px 20px;box-shadow:0 4px 0 #c9bba0,0 6px 12px rgba(0,0,0,.25);min-height:0}
.skip.on{background:var(--orange);color:#fff;box-shadow:0 4px 0 #a86a1c}
.lobbybar{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 8px 6px 12px;font-size:clamp(11px,1.4vw,14px);box-shadow:0 2px 0 rgba(0,0,0,.12);max-width:min(92vw,560px)}
.lobbybar code{background:#f1e6cc;padding:4px 8px;border-radius:8px;font-size:clamp(10px,1.2vw,13px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.lobbybar button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;padding:7px 12px;min-height:0;white-space:nowrap}
.count{top:10px;left:10px}
.start{left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:16px;background:var(--orange);color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(16px,2.4vw,24px);padding:10px 36px;box-shadow:0 5px 0 #a86a1c,0 8px 14px rgba(0,0,0,.25);min-height:0}
.start:disabled{background:#c9bba0;box-shadow:0 5px 0 #9a8c74}
.custom{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border-radius:16px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:6;width:min(92vw,420px)}
.custom .sw{display:flex;gap:6px;flex-wrap:wrap}
.custom .sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0;min-height:0}
.custom .sw button.on{border-color:var(--ink)}
.custom .hats button{border:1px solid #d9c9a6;background:#fff;color:var(--ink);border-radius:10px;padding:5px 10px;min-height:0;font-size:13px}
.custom .hats button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.custom input{background:#fff;color:var(--ink);border:1px solid #d9c9a6}
.guess{left:10px;bottom:62px;background:rgba(255,255,255,.95);border-radius:12px;padding:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:min(92vw,520px);z-index:4}

<script>
// Script daha başlamadan çökerse "Yükleniyor…" yerine hatayı göster (sürüm damgasıyla).
window.KG_VER='2026-10-31b';
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&/Yükleniyor/.test(a.textContent)){a.innerHTML='<div class="panel" style="border-color:#ff6b6b"><p><b>Sayfa açılamadı.</b> Sürüm '+KG_VER+'</p><p class="small" style="word-break:break-all">'+String(e.message||e.error||e)+(e.filename?' @'+e.lineno:'')+'</p><p class="small">Tarayıcı: '+navigator.userAgent+'</p><button onclick="location.reload(true)">Yeniden dene</button></div>'}});
setTimeout(function(){var a=document.getElementById('app');if(a&&/Yükleniyor/.test(a.textContent)){a.innerHTML='<div class="panel" style="border-color:#ffb347"><p><b>Sayfa yüklenemedi.</b> Sürüm '+KG_VER+'</p><p class="small">Tarayıcı: '+navigator.userAgent+'</p><button onclick="location.reload(true)">Yeniden dene</button></div>'}},8000);
</script>
<script src="sunucu/game.js?v=__V__"></script>
<script>
// ---------- Rol tanımları: sunucu/game.js ile tek kaynak (window.KG_GAME) ----------
const {ROLES,SETUP,COLORS,HATS:HAT_IDS,roleLabel,DAGILIM}=window.KG_GAME;
const HAT_NAMES={none:'Yok',beanie:'Bere',cap:'Kasket',ears:'Kulak',bow:'Fiyonk',glasses:'Gözlük',hood:'Kapüşon'};
const HATS=HAT_IDS.map(k=>[k,HAT_NAMES[k]||k]);
const TEAMN={inn:'Masum',imp:'Hain',neu:'Tarafsız'};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

// ---------- Durum ----------
// myId: sunucunun verdiği açık kimlik (join yanıtı). uid (kg_uid) gizli anahtardır, yalnız sunucuya gider.
let isHost=false,myId=null,active=false,myName=ls('kg_name')||'',roomCode=null,ws=null,connected=false,everConnected=false,connErr=null,wantHost=false,fatal=false,retryN=0,retryT=null;
// Kimlik (tasarım gecmis §5.2): /ayar.json kayıt açıksa anonim Supabase oturumu; token join'de gider, sunucu imzayı doğrular.
// Oturum en çok 2 sn beklenir; gelmezse bu sayfa yüklemesi boyunca misafir (kg_uid). Son token kg_token'da durur: Supabase'e
// ulaşılamasa da (süresi dolmuş olsa da) aynı kimlikle bağlanılır. kayitli: sunucunun join yanıtı (you.kayitli).
let ayar=null,kayitli=false,token=ls('kg_token')||null,sb=null,kimlikSoz=null;
let hesap={uuid:null,eposta:null,anonim:true}; // Supabase oturumu (Plan 6): e-posta bağlıysa eposta dolu; kimlikHazirla doldurur, doğrulama günceller
let gecmis=null; // giriş sayfası geçmiş bloğu (Plan 5): {ozet, oyunlar, kasabalar}; Supabase'ten arka planda gelir, 3 sn zaman aşımı, hata sessiz
let chatLog=[]; // sohbet state ile değil, parça parça gelir ({t:'chat'}); P.chat buna bağlanır
let myLook=ls('kg_look')||{color:COLORS[Math.floor(Math.random()*COLORS.length)],hat:HATS[Math.floor(Math.random()*HATS.length)][0]};
let P={phase:'landing'};
let priv={role:null,notes:[],mates:[],dchat:[],uses:{},vest:0,planted:[]}; // planted: dinamit konan evlerin id listesi
let lobby=[];let local={act:{},vote:null};
let settings=ls('kg_settings')||{night:30,talk:120,vote:45};
let lastKey=null,sel={},skew=0,connSince=Date.now();
let ui={menu:false,notes:false,custom:false,roleCard:false,rules:false,hizli:false,hizliAlt:null,rehber:false,hesap:{tur:null,adim:'eposta',eposta:'',hata:'',bekleBitis:0,N:0,eski:null,yukleniyor:false,bilgi:''}}; // hesap: bağla/gir formu (yalnız giriş sayfası)
let hizliSon=0,hizliUyari='',hizliUyariT=null; // ⚡ hızlı ifade: yerel bekleme göstergesi ve sunucunun err soft uyarısı (sunucu yetkili)
function now(){return Date.now()-skew}
const app=document.getElementById('app');
const uid=ls('kg_uid')||('u'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,24):Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10)));ls('kg_uid',uid);
function inviteLink(){const s=qs.get('s');return location.origin+location.pathname+'?oda='+roomCode+(s&&sunucuIzinli(s,location)?'&s='+encodeURIComponent(s):'')}
function lobbyState(){return{phase:'lobby',chat:[],dead:[],players:[],lobby:[]}}
// GitHub Pages gibi başka bir yerden açılacaksa sunucu adresi buraya (ör. 'wss://oyun.ornek.com').
const KG_SERVER='';
// ?s= ile sunucu seçmek yalnız yerel geliştirmede (localhost) ya da sayfanın kendi sunucusu için geçerlidir: join'de giden
// gizli anahtar (kg_uid) linke yazılan yabancı bir adrese gitmesin (kimlik çalınır). Saf fonksiyon: e2e test eder.
function sunucuIzinli(s,loc){
  if(!s)return false;let host;try{host=new URL((/^\w+:\/\//.test(s.trim())?s.trim():'wss://'+s.trim()).replace(/^http/,'ws')).host}catch(e){return false}
  const yerel=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(loc.hostname)||loc.protocol==='file:';
  return yerel||host===loc.host;
}

// ---------- Sunucu bağlantısı (WebSocket) ----------
// Oda ve oyun sunucuda yaşar; ev sahibi dahil herkes aynı şekilde bağlanır.
function wsUrl(){
  const s=(sunucuIzinli(qs.get('s'),location)?qs.get('s'):'')||KG_SERVER;
  if(s){let u=s.trim().replace(/^http/,'ws').replace(/\/+$/,'');if(!/^wss?:\/\//.test(u))u='wss://'+u;if(!/\/ws$/.test(u))u+='/ws';return u}
  return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
}
function hostRoom(reuse){
  wantHost=true;isHost=true;active=true;roomCode=reuse?(ls('kg_room')||null):null;P=lobbyState();render();(kimlikSoz||Promise.resolve()).then(connect); // kimlik en çok 2 sn
}
function joinRoom(code){
  wantHost=false;active=true;roomCode=code;P=lobbyState();render();(kimlikSoz||Promise.resolve()).then(connect);
}
function yukle(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error(src));document.head.append(e)})}
async function kimlikHazirla(){
  try{ayar=await (await fetch('ayar.json',{cache:'no-cache'})).json()}catch(e){ayar=null}
  if(!ayar||!ayar.kayit||!ayar.url||!ayar.anonKey)return null;
  const oturum=(async()=>{await yukle('sayfa/supabase.js?v='+KG_VER);sb=window.supabase.createClient(ayar.url,ayar.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
    let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();session=r.data&&r.data.session}
    if(session&&session.user)hesapGuncelle(session);
    sb.auth.onAuthStateChange((ev,s)=>{if(s&&s.access_token)ls('kg_token',s.access_token)}); // yenilenen token bir sonraki yüklemede kullanılır
    return session&&session.access_token||null})();
  oturum.catch(()=>{}); // yarış 2 sn'de biterse sonradan gelen hata konsola düşmesin
  let t;try{t=await Promise.race([oturum,new Promise(r=>setTimeout(()=>r(undefined),2000))])}catch(e){t=null}
  if(t){token=t;ls('kg_token',t)} // undefined/null: zaman aşımı ya da hata → eldeki eski token (varsa) ile devam
  return token;
}
// ---------- Hesap: e-posta ile bağlama ve ikinci cihaz (Plan 6; tasarım …eposta-kod-design.md §5.1, §5.6) ----------
// Yalnız giriş sayfasında (odadayken kimlik değişmez). Kod GoTrue'dan gelir; mail sunucudaki kancayla gider. Düğmeler ayar.eposta ile görünür.
function hesapGuncelle(session){hesap={uuid:session.user.id,eposta:session.user.email||null,anonim:session.user.is_anonymous!==false&&!session.user.email};token=session.access_token;ls('kg_token',token)}
function hatirlatGoster(ayar,kayitli,hesapEposta){return !!(ayar&&ayar.eposta&&kayitli&&!hesapEposta)} // son ekran hatırlatması: e-postasız kayıtlı oyuncu
const HESAP_SURE_MS=10000;
function hesapHataMetni(e){const m=((e&&(e.code||e.error_code))||'')+' '+((e&&e.message)||'');
  if(/email_exists|user_already_exists|already registered|already been registered/i.test(m))return "Bu e-posta başka bir hesaba bağlı; o hesapla girmek için 'Hesabınla gir'.";
  if(/otp_expired|invalid|expired/i.test(m))return 'Kod yanlış ya da süresi dolmuş.';
  if(/rate_limit|rate limit|429|too many/i.test(m))return 'Çok sık istek; 1 dk bekle.';
  if(/signup_disabled|user_not_found|otp_disabled|not allowed|not found/i.test(m))return 'Bu e-posta kayıtlı değil; önce ilk cihazında bağla.';
  return 'Şu an gönderilemedi, tekrar dene.'}
function hesapSure(p){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('zaman_asimi')),HESAP_SURE_MS))])}
function hesapAc(tur){ui.hesap={tur,adim:'eposta',eposta:'',hata:'',bekleBitis:0,N:0,eski:null,yukleniyor:false,bilgi:''};render()}
function hesapKapat(){ui.hesap.tur=null;ui.hesap.hata='';render()}
async function hesapKodGonder(){
  const h=ui.hesap;const e=(document.getElementById('hesapEposta')||{}).value||h.eposta;h.eposta=String(e||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(h.eposta)){h.hata='E-posta adresini kontrol et.';render();return}
  if(!sb||h.yukleniyor)return;h.yukleniyor=true;h.hata='';render();
  try{
    if(h.tur==='bagla'){const {error}=await hesapSure(sb.auth.updateUser({email:h.eposta}));if(error)throw error}
    else{ // gir: önce bu cihazın anonim geçmişi (N) ve eski token; sonra kod iste (kayıtlı olmayan adrese hesap açılmaz)
      h.eski=ls('kg_token')||token;let N=0;try{const r=await hesapSure(sb.from('oyun_oyunculari_acik').select('oyun_id',{count:'exact',head:true}).eq('uye',hesap.uuid));N=r.count||0}catch(x){N=0}h.N=N;
      const {error}=await hesapSure(sb.auth.signInWithOtp({email:h.eposta,options:{shouldCreateUser:false}}));if(error)throw error}
    h.adim='kod';h.bekleBitis=Date.now()+60000;
  }catch(err){h.hata=hesapHataMetni(err)}
  h.yukleniyor=false;render();
}
async function hesapDogrula(){
  const h=ui.hesap;const kod=String((document.getElementById('hesapKod')||{}).value||'').replace(/\D/g,'');
  if(kod.length!==6){h.hata='6 haneli kodu yaz.';render();return}
  if(!sb||h.yukleniyor)return;h.yukleniyor=true;h.hata='';render();
  try{
    const {data,error}=await hesapSure(sb.auth.verifyOtp({email:h.eposta,token:kod,type:h.tur==='bagla'?'email_change':'email'}));if(error)throw error;
    if(data&&data.session)hesapGuncelle(data.session);
    // güvenlik: hesaba rastgele bir şifre atanır (bu oyunda şifre yok; adresi başkası önceden şifreyle açtıysa o şifre geçersiz olsun). Hata sessiz.
    try{await hesapSure(sb.auth.updateUser({password:rastgeleSifre()}))}catch(e){}
    if(h.tur==='gir'){if(h.N>0){h.adim='birlestir';h.yukleniyor=false;render();return}h.yukleniyor=false;return hesapBirlestir(true)}
    h.tur=null;
  }catch(err){h.hata=hesapHataMetni(err)}
  h.yukleniyor=false;render();
}
// İkinci cihaz: Ekle → sunucu iki taze token'la RPC'yi çağırır; Hayır → hiçbir çağrı yok. Sonra sayfa yenilenir (yeni kimlikle giriş bloğu).
async function hesapBirlestir(ekle){
  const h=ui.hesap;if(!ekle){h.tur=null;location.reload();return}
  h.yukleniyor=true;h.adim='birlestir';h.bilgi='Geçmiş taşınıyor…';render();
  try{const r=await hesapSure(fetch('/hesap/birlestir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eski:h.eski,yeni:token})}));
    if(!r.ok){const j=await r.json().catch(()=>({}));h.bilgi='Giriş yapıldı; bu cihazın eski geçmişi doğrulanamadığı için taşınamadı ('+(j.error||r.status)+').';render();setTimeout(()=>location.reload(),3000);return}
  }catch(e){h.bilgi='Giriş yapıldı; geçmiş şu an taşınamadı.';render();setTimeout(()=>location.reload(),3000);return}
  location.reload();
}
function rastgeleSifre(){const a=new Uint8Array(48);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a))} // 64 karakter
// yalnız bu cihaz: scope 'local' (varsayılan 'global' diğer cihazların yenileme token'larını da iptal eder)
async function hesapCikis(){try{if(sb)await hesapSure(sb.auth.signOut({scope:'local'}))}catch(e){}try{localStorage.removeItem('kg_token')}catch(e){}location.reload()}
function hesapBlok(pn){
  const h=ui.hesap;
  if(hesap.eposta&&!(h.tur==='gir'&&h.adim==='birlestir')){const d=el('p','small muted kimlik-notu hesap-durum','Hesabın: '+hesap.eposta);const b=el('button','small hesap-cikis','Bu cihazdan çık');b.onclick=()=>hesapCikis();const r=el('div','row');r.append(d,b);pn.append(r);return}
  if(!hesap.eposta)pn.append(el('p','small muted kimlik-notu hesap-durum','Kimliğin bu tarayıcıda; veriler silinirse geçmiş gider.'));

// Yalnız anon anahtar + oturum (RLS). Oyun kurma akışını beklemez: sonuç gelirse ve hâlâ giriş sayfasındaysak yeniden çizilir.
async function gecmisYukle(){
  if(!sb||!ayar||!ayar.kayit)return;
  const sorgu=(async()=>{
    const {data:{session}}=await sb.auth.getSession();if(!session)return null;const ben=session.user.id;
    // görebildiğim son 30 bitmiş maç (oyuncusu ya da kasaba üyesi olduğum) → içlerinden oynadıklarım, en çok 10
    const [oz,oy,uy]=await Promise.all([
      sb.from('oyuncu_ozet').select('oyun,kazanma,en_cok_rol').eq('kurulum',ayar.kurulum||''),
      sb.from('oyunlar').select('id,kasaba_id,bitis,kazanan_takim,kazanan_metin,oyuncu_sayisi').eq('kurulum',ayar.kurulum||'').eq('sonuc','bitti').order('bitis',{ascending:false}).limit(30),
      sb.from('kasaba_uyeleri').select('kasaba_id').eq('uye',ben)]);
    const oyunlar=oy.data||[],kasabaIds=[...new Set([...(uy.data||[]).map(u=>u.kasaba_id),...oyunlar.map(o=>o.kasaba_id)].filter(Boolean))];
    const [kat,ks]=await Promise.all([
      oyunlar.length?sb.from('oyun_oyunculari_acik').select('oyun_id,rol_key,takim,deli_gibi,calinan_rol,sonunda_sag').eq('uye',ben).in('oyun_id',oyunlar.map(o=>o.id)):{data:[]},
      kasabaIds.length?sb.from('kasabalar').select('id,ad').in('id',kasabaIds):{data:[]}]);
    const benim=new Map((kat.data||[]).map(k=>[k.oyun_id,k])),kasabaAd=new Map((ks.data||[]).map(k=>[k.id,k.ad]));
    const uyeKasabalar=(uy.data||[]).map(u=>({id:u.kasaba_id,ad:kasabaAd.get(u.kasaba_id)||'Kasaba'}));
    return {ozet:(oz.data||[])[0]||null,oyunlar:oyunlar.filter(o=>benim.has(o.id)).slice(0,10).map(o=>({...o,ben:benim.get(o.id),kasaba:kasabaAd.get(o.kasaba_id)||null})),kasabalar:uyeKasabalar};
  })();
  sorgu.catch(()=>{});
  const v=await Promise.race([sorgu,new Promise(r=>setTimeout(()=>r(null),3000))]).catch(()=>null);

}

  if(P.skor&&P.skor.length){const sk=el('div','skor');sk.append(el('b',null,'BU AKŞAM'));P.skor.forEach(s=>sk.append(el('span','cip',s.ad+' '+s.kazandi+'/'+s.oynadi)));c.append(sk)}
  // rövanş: hazır bayrakları (sunucuda), N = oyundakiler ∪ lobidekiler; ev sahibi yalnız hazır ∧ bağlı 4–12 kişiyle başlatır
  const uyeler=new Map();(P.players||[]).forEach(p=>uyeler.set(p.id,p.name));(P.lobby||[]).forEach(p=>uyeler.set(p.id,p.name));
  const hazir=new Set(P.hazir||[]),online=new Set(P.online||[]);const hazirBagli=[...uyeler.keys()].filter(id=>online.has(id)&&(hazir.has(id)||id===P.hostId));
  const sayi=[...uyeler.keys()].filter(id=>online.has(id)&&hazir.has(id)).length; // sayaç: hazır ∧ bağlı (kopuk hazır sayılmaz; düğme ayrıca ev sahibini sayar)
  const rv=el('div','rovans');
  const EK={0:'ı',1:'i',2:'si',3:'ü',4:'ü',5:'i',6:'sı',7:'si',8:'i',9:'u',10:'u',11:'i',12:'si'}; // "6'sı hazır"
  rv.append(el('div','hazir-sayac',uyeler.size+" kişiden "+sayi+"'"+(EK[sayi]||'i')+' hazır'));
  const cips=el('div','cipler');uyeler.forEach((ad,id)=>{const on=online.has(id);cips.append(el('span',!on?'off':hazir.has(id)?'on':'',(!on?'📵 ':hazir.has(id)?'✅ ':'⏳ ')+ad))});rv.append(cips);
  const row=el('div','row');
  if(uyeler.has(myId)){const ben=hazir.has(myId);const hb=el('button',ben?'hazir on':'hazir ok',ben?'Vazgeç':'Rövanşa hazırım');hb.onclick=()=>send({t:'hazir',v:!ben});row.append(hb)}
  if(isHost){const m=hazirBagli.length;const rb=el('button','ok rovans','Rövanşı başlat ('+m+' hazır)');rb.disabled=!(m>=4&&m<=12);rb.onclick=()=>send({t:'start',settings,rovans:true});row.append(rb);
    const lb=el('button','lobi','Lobiye dön');lb.onclick=()=>endToLobby();row.append(lb)}
  rv.append(row);
  if(isHost&&hazirBagli.length<4)rv.append(el('div','small','Rövanş için en az 4 hazır ve bağlı oyuncu gerekir.'));
  if(!isHost)rv.append(el('p','small','Ev sahibi rövanşı başlatınca yeni maç başlar; hazır değilsen odada beklersin.'));
  c.append(rv);
  stage.append(c);
}
setInterval(()=>{if(P.ends&&P.phase!=='lobby'&&P.phase!=='end'&&P.phase!=='landing'){const t=document.querySelector('.timer');if(t)t.textContent=fmtTime(P.ends-now())}},1000);
setInterval(()=>{if(!everConnected&&!connErr&&myId)render()},3000);
setInterval(()=>{if(P.phase==='talk'||P.phase==='vote')render()},2500); // konuşma balonları ve ufak güncellemeler
// döndürme: halka yeniden sığdırılır. Telefonda klavye açılınca da resize gelir; bir giriş kutusu odaktayken yeniden çizme
// (menü yeniden kurulur, kutu odağını kaybeder, klavye kapanır)
let resizeT=null,resizeBekliyor=false;
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){resizeBekliyor=true;return}render()},150)});
document.addEventListener('focusout',()=>{if(resizeBekliyor){resizeBekliyor=false;setTimeout(render,50)}}); // ertelenen yeniden çizim
// ---------- Başlat (tüm tanımlar yüklendikten sonra) ----------
const qs=new URLSearchParams(location.search);
kimlikSoz=kimlikHazirla().catch(()=>null).then(()=>{if(!active)render();gecmisYukle().catch(()=>{})}); // kimlik gelince giriş sayfasındaki not güncellenir; geçmiş arka planda
if(qs.get('bagla')==='1'){ui.hesap.tur='bagla';try{history.replaceState(null,'',location.pathname)}catch(e){}} // form açık gelir; koşullar (kayıt, e-posta, oturum) renderLanding'de denetlenir
if(qs.get('oda')){joinRoom(qs.get('oda').toLowerCase().replace(/[^a-z0-9]/g,''))}else{render()}
setInterval(()=>{if(!active&&ui.hesap.tur&&ui.hesap.adim==='kod'){const y=document.querySelector('button.hesap-yeniden');if(!y)return;const kalan=Math.max(0,Math.ceil((ui.hesap.bekleBitis-Date.now())/1000));y.textContent=kalan>0?'Kodu yeniden gönder ('+kalan+')':'Kodu yeniden gönder';y.disabled=kalan>0||ui.hesap.yukleniyor}},1000); // sayaç: tam yeniden çizim yok (kod kutusu odağını korur)
</script>
