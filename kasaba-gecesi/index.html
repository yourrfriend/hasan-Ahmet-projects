<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1226">
<title>Kasaba Gecesi</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Giriş sayfası koyu panel; oyun ve lobi tam ekran köy sahnesi. Tüm oyun arayüzü sahnenin içinde kaplama olarak durur. */
:root{
  --bg:#0f1226; --panel:#181c3a; --panel2:#20254a; --line:#2f3566;
  --fg:#eef0ff; --muted:#9aa0c9; --accent:#ffb347; --accent-ink:#2a1700;
  --inn:#5aa9ff; --imp:#ff5c5c; --neu:#c08cff; --danger:#ff6b6b;
  --ink:#3a2f1c; --paper:#fbf6ea; --orange:#e8842a;
  --display:"Nunito","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body.landing{padding:12px 16px 32px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
h1{font-size:30px;font-weight:900}
h2{font-size:18px;font-weight:800}
h3{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:9px 14px;min-height:40px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
input,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.moon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3d6,var(--accent) 60%,#8a5a12);box-shadow:0 0 24px rgba(255,179,71,.45)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.setup{display:grid;gap:6px}
.setup .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--panel2)}
.setup .r .n{font-weight:700;font-size:14px}.setup .r .d{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--panel2)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.dot.inn{background:var(--inn)}.dot.imp{background:var(--imp)}.dot.neu{background:var(--neu)}

/* ---------- Sahne ---------- */
.stage{position:fixed;inset:0;background:#6aa844;overflow:hidden;font-family:var(--body)}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%}
.stage .bean{transition:transform 1s cubic-bezier(.4,0,.2,1),opacity .5s}
.stage .bean.fast{transition:transform .6s ease-out,opacity .3s}
.stage .nightlayer{transition:opacity 1.6s}
.stage .fade{transition:opacity .6s}
.stage .bubble{animation:bubble 6s forwards}
@keyframes bubble{0%,70%{opacity:1}100%{opacity:0}}
.stage .plus{animation:plus 1.6s ease-out infinite}
@keyframes plus{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.stage .bolt{animation:bolt .9s steps(1) 3}
@keyframes bolt{0%,100%{opacity:1}50%{opacity:0}}
.stage .shake{animation:shake .5s 3}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.stage .smoke{animation:smoke 2.5s ease-out forwards}
@keyframes smoke{0%{opacity:.9;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-70px) scale(1.6)}}
.stage .ghost{animation:ghost 2.4s ease-in-out infinite}
@keyframes ghost{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ov{position:absolute;z-index:2;font-family:var(--body);color:var(--ink)}
.pill{background:rgba(255,255,255,.78);border-radius:10px;padding:4px 12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.rolebar{top:10px;left:10px;display:flex;gap:3px;background:rgba(255,255,255,.55);padding:4px;border-radius:9px;max-width:60vw}
.rolebar .r{width:clamp(20px,3vw,32px);height:clamp(20px,3vw,32px);flex:none;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:clamp(11px,1.7vw,18px);font-weight:900;color:#7a6a55;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.rolebar .r i{position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%}
.timerbox{top:10px;right:56px;background:rgba(255,255,255,.78);border-radius:10px;padding:2px 12px;display:flex;align-items:center;gap:8px;font-weight:900;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.timerbox .timer{font-family:var(--display);font-size:clamp(17px,2.6vw,28px);font-variant-numeric:tabular-nums}
.timerbox small{font-size:clamp(9px,1.1vw,12px);font-weight:700;color:#7a6a55}
.gear{top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.78);display:grid;place-items:center;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.12);cursor:pointer;border:0;min-height:0;padding:0}
.menu{top:56px;right:10px;background:rgba(255,255,255,.96);border-radius:12px;padding:6px;display:grid;gap:4px;min-width:200px;max-width:min(92vw,420px);max-height:calc(100vh - 70px);overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.3);font-size:14px;font-weight:700;z-index:5}
.menu button{border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 10px;border-radius:8px;min-height:0;font-weight:700}
.menu button:hover{background:#f1e6cc}
.menu button.d{color:#b3202a}
.menu .h{font-size:11px;color:#7a6a55;letter-spacing:.08em;padding:4px 10px 0}
.menu label{display:grid;gap:3px;font-size:12px;color:#7a6a55;padding:4px 10px}
.menu input{background:#fff;color:var(--ink);border:1px solid #d9c9a6;min-height:34px;padding:5px 8px}
.hint{top:54px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.42);color:#fff;font-size:clamp(10px,1.3vw,13px);padding:4px 12px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.box{top:54px;left:50%;transform:translateX(-50%);background:rgba(20,10,30,.88);color:#fff;border-radius:14px;padding:10px 18px;text-align:center;border:2px solid var(--accent);font-size:clamp(11px,1.4vw,14px);max-width:92vw;z-index:4}
.box .t{font-family:var(--display);font-size:clamp(14px,2vw,19px);font-weight:900}
.box.center{top:50%;transform:translate(-50%,-50%);padding:18px 24px;min-width:min(92vw,360px)}
.box .ok{margin-top:10px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;padding:8px 22px;min-height:0}
.chat{left:10px;bottom:10px;width:min(300px,46vw);display:grid;gap:6px;z-index:3}
.chat .log{display:grid;gap:3px;max-height:34vh;overflow-y:auto;scrollbar-width:none}
.chat .log div{display:flex;align-items:flex-start;gap:6px;background:rgba(0,0,0,.4);color:#fff;font-size:clamp(10px,1.3vw,12px);padding:4px 9px 4px 4px;border-radius:12px;width:fit-content;max-width:100%;backdrop-filter:blur(2px)}
.chat .log div.sys{background:rgba(255,179,71,.4);color:#fff3d6}
.chat .log div.dead{background:rgba(120,90,200,.45)}
.chat b{width:14px;height:14px;border-radius:50%;flex:none;margin-top:2px}
.chat .in{display:flex;gap:6px}
.chat input{flex:1;border:0;border-radius:10px;padding:8px 12px;font-size:clamp(12px,1.4vw,14px);background:rgba(255,255,255,.92);color:var(--ink);min-height:0}
.chat .in button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;padding:0 14px;min-height:0}
.mine{right:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border-radius:12px;padding:6px 10px;font-size:clamp(10px,1.3vw,13px);box-shadow:0 2px 0 rgba(0,0,0,.12);max-width:44vw;cursor:pointer;border:0;min-height:0;color:var(--ink);text-align:left}
.mine .ic{font-size:clamp(18px,2.6vw,26px)}
.mine b{display:block;font-family:var(--display);font-size:clamp(12px,1.6vw,16px)}
.mine .team{font-size:9px;letter-spacing:.1em;font-weight:900}
.notesbtn{right:10px;bottom:66px;background:rgba(255,255,255,.88);border-radius:12px;padding:6px 10px;font-weight:800;font-size:clamp(10px,1.2vw,13px);box-shadow:0 2px 0 rgba(0,0,0,.12);border:0;min-height:0;color:var(--ink)}
.notes{right:10px;bottom:104px;width:min(280px,60vw);background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;font-size:clamp(10px,1.2vw,12px);box-shadow:0 8px 20px rgba(0,0,0,.3);max-height:40vh;overflow:auto;z-index:4}
.notes .h{font-weight:900;font-size:11px;letter-spacing:.08em;color:#7a6a55;margin-bottom:4px}
.notes div.n{padding:3px 0;border-top:1px solid #eee}
.act{left:10px;bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:60vw;z-index:3}
.act button{border:0;border-radius:12px;padding:7px 12px;font-weight:800;font-size:clamp(11px,1.4vw,14px);background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);min-height:0}
.act button.on{background:#e23b3b;color:#fff;box-shadow:0 3px 0 #8f1f1f}
.act button.ab.on{background:#2563eb;box-shadow:0 3px 0 #1e3a8a}
.skip{right:10px;bottom:66px;border:0;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:900;font-family:var(--display);font-size:clamp(13px,1.8vw,18px);padding:7px 20px;box-shadow:0 4px 0 #c9bba0,0 6px 12px rgba(0,0,0,.25);min-height:0}
.skip.on{background:var(--orange);color:#fff;box-shadow:0 4px 0 #a86a1c}
.lobbybar{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 8px 6px 12px;font-size:clamp(11px,1.4vw,14px);box-shadow:0 2px 0 rgba(0,0,0,.12);max-width:min(92vw,560px)}
.lobbybar code{background:#f1e6cc;padding:4px 8px;border-radius:8px;font-size:clamp(10px,1.2vw,13px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.lobbybar button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;padding:7px 12px;min-height:0;white-space:nowrap}
.count{top:10px;left:10px}
.start{left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:16px;background:var(--orange);color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(16px,2.4vw,24px);padding:10px 36px;box-shadow:0 5px 0 #a86a1c,0 8px 14px rgba(0,0,0,.25);min-height:0}
.start:disabled{background:#c9bba0;box-shadow:0 5px 0 #9a8c74}
.custom{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border-radius:16px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:6;width:min(92vw,420px)}
.custom .sw{display:flex;gap:6px;flex-wrap:wrap}
.custom .sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0;min-height:0}
.custom .sw button.on{border-color:var(--ink)}
.custom .hats button{border:1px solid #d9c9a6;background:#fff;color:var(--ink);border-radius:10px;padding:5px 10px;min-height:0;font-size:13px}
.custom .hats button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.custom input{background:#fff;color:var(--ink);border:1px solid #d9c9a6}
.guess{left:10px;bottom:62px;background:rgba(255,255,255,.95);border-radius:12px;padding:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:min(92vw,520px);z-index:4}
.guess button{border:1px solid #d9c9a6;background:#fff;color:var(--ink);border-radius:8px;padding:4px 8px;min-height:0;font-size:12px}
.guess button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.endcard{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border-radius:18px;padding:18px 20px;display:grid;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.45);width:min(94vw,520px);max-height:90vh;overflow:auto;z-index:6}
.endcard .w{font-family:var(--display);font-size:clamp(22px,3.4vw,34px);font-weight:900;text-align:center}
.endcard .roll{display:grid;gap:4px}
.endcard .roll div{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;background:#f6efe0;border-radius:8px;font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tag.inn{background:rgba(59,130,246,.18);color:#1d4ed8}.tag.imp{background:rgba(226,59,59,.18);color:#b3202a}.tag.neu{background:rgba(124,58,237,.18);color:#6d28d9}
.endcard .ok{border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:800;padding:10px 20px;min-height:0}
.rotate{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,18,38,.96);color:#fff;place-items:center;text-align:center;padding:30px;font-size:18px;font-weight:700}
@media(orientation:portrait) and (max-width:700px){.rotate{display:grid}}
.conn{top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);border-radius:14px;padding:14px 18px;max-width:min(92vw,420px);z-index:6}
.conn ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:#7a6a55}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
// ---------- Rol tanımları ----------
// act: 'other' = bir ev seçer, 'self' = kendine, yok = yetenek yok. pos: gece gittiği evde nerede durur.
const ROLES={
  masum:{n:'Masum',team:'inn',ico:'🏠',desc:'Özel bir yeteneğin yok. Gündüz tartış, oylamayla hainleri bul.'},
  doktor:{n:'Doktor',team:'inn',ico:'💉',desc:'Gece birini seç. O gece saldırıya uğrarsa kurtulur.',act:'other',pos:'door'},
  deli:{n:'Deli',team:'inn',ico:'🌀',desc:'Masum bir rol olduğunu sanırsın ama yaptıkların hiçbir şey değiştirmez.'},
  polis:{n:'Polis',team:'inn',ico:'👮',desc:'Seçtiğin kişi o gece evden çıkamaz; rolünü kullanamaz. Seri Katil\'i tutamazsın.',act:'other',dual:true,pos:'door'},
  gozcu:{n:'Gözcü',team:'inn',ico:'🔭',desc:'Seçtiğin evi gözetlersin; o gece kaç kişinin geldiğini öğrenirsin.',act:'other',dual:true,pos:'bush'},
  izci:{n:'İzci',team:'inn',ico:'👣',desc:'Seçtiğin kişiyi izlersin; gece hangi eve gittiğini öğrenirsin.',act:'other',dual:true,pos:'bush'},
  dedektif:{n:'Dedektif',team:'inn',ico:'🔍',desc:'Seçtiğin kişinin evini ararsın; olabileceği rolleri öğrenirsin.',act:'other',dual:true,pos:'window'},
  tuzakci:{n:'Tuzakçı',team:'inn',ico:'🪤',desc:'Seçtiğin evin önüne tuzak kurarsın; o eve gelen herkes yakalanır ve rolünü kullanamaz.',act:'other',dual:true,pos:'door'},
  ispiyoncu:{n:'İspiyoncu',team:'inn',ico:'📣',desc:'Bir kez: seçtiğin kişinin rolünü sabah meydanda herkese açıklarsın.',act:'other',once:true,dual:true,pos:'window'},
  provokator:{n:'Provokatör',team:'inn',ico:'🔥',desc:'Bir kez: seçtiğin kişi ertesi günkü oylamaya 2 oyla başlar.',act:'other',once:true,dual:true,pos:'door'},
  hain:{n:'Hain',team:'imp',ico:'🗡️',desc:'Her gece birinin evine girip onu öldürürsün. Hainler birbirini tanır ama gece birbirini göremez.'},
  temizlikci:{n:'Temizlikçi',team:'imp',ico:'🧹',desc:'Gece ya öldürürsün ya temizlersin: seçtiğin kişi o gece ölürse rolü sabah gizli kalır.',act:'other',pos:'door'},
  suclayici:{n:'Suçlayıcı',team:'imp',ico:'🫵',desc:'Gece ya öldürürsün ya suçlarsın: seçtiğin kişi o gece ölür ya da ertesi gün asılırsa rolü Hain görünür.',act:'other',pos:'door'},
  hayatta:{n:'Hayatta Kalan',team:'neu',ico:'🦺',desc:'Sona kadar yaşa. 3 kez yelek giyebilirsin; yelekliyken ölmezsin. Kazanan tarafla kazanırsın.',act:'self'},
  serikatil:{n:'Seri Katil',team:'neu',ico:'🔪',desc:'Her gece birinin evine girip onu öldürürsün. Polis seni tutamaz. Tek başına kalınca kazanırsın.',act:'other',pos:'enter'},
  bombaci:{n:'Bombacı',team:'neu',ico:'🧨',desc:'Her gece bir eve dinamit koyarsın. İstediğin gece hepsini patlatırsın. Herkes ölünce kazanırsın.',act:'other',pos:'door'},
  hirsiz:{n:'Hırsız',team:'neu',ico:'🎭',desc:'Seçtiğin kişinin evine girip onu öldürür ve rolünü çalarsın; artık o rolle o tarafta oynarsın.',act:'other',pos:'enter'},
  buyucu:{n:'Büyücü',team:'neu',ico:'⚡',desc:'Evinden çıkmadan birini seçip rolünü tahmin edersin. Doğruysa yıldırımla ölür, Doktor kurtaramaz. Yanlışsa sen ölürsün. Tek başına kazanırsın.',act:'other',guess:true,pos:'home'},
  hortlak:{n:'Hortlak',team:'neu',ico:'🕯️',desc:'Gece bir evin önüne mum koyarsın. Ertesi gün asılırsan o gece hayalet olarak gelir, mum koyduğun kişiyi öldürürsün. Asılınca kazanırsın.',act:'other',pos:'door'}
};
const TEAMN={inn:'Masum',imp:'Hain',neu:'Tarafsız'};
const MADPOOL=['doktor','polis','gozcu','izci','dedektif','tuzakci','ispiyoncu','provokator'];
const INVGROUPS=[['doktor','serikatil','hirsiz'],['polis','hain','hayatta'],['gozcu','dedektif','bombaci'],['tuzakci','ispiyoncu','temizlikci'],['provokator','suclayici','masum'],['izci','buyucu','hortlak']];
const DUAL=['polis','gozcu','izci','dedektif','tuzakci','ispiyoncu','provokator'];
const SETUP=[
  ...['masum','doktor','deli','polis','gozcu','izci','dedektif','tuzakci','ispiyoncu','provokator'].map(k=>({id:k,key:k,team:'inn'})),
  {id:'hain',key:'hain',team:'imp'},{id:'temizlikci',key:'temizlikci',team:'imp'},{id:'suclayici',key:'suclayici',team:'imp'},
  ...DUAL.map(k=>({id:k+'_h',key:k,team:'imp'})),
  ...['hayatta','serikatil','bombaci','hirsiz','buyucu','hortlak'].map(k=>({id:k,key:k,team:'neu'}))
];
const COLORS=['#3b7bff','#ff6fae','#2fb55a','#ffd23f','#8e4bff','#2fd3c8','#ff7a2f','#f4f1e8','#6b3f2a','#e23b3b','#9bd84a','#ff9ad5'];
const HATS=[['none','Yok'],['beanie','Bere'],['cap','Kasket'],['ears','Kulak'],['bow','Fiyonk'],['glasses','Gözlük'],['hood','Kapüşon']];
function roleLabel(r){const b=ROLES[r.key];return b.n+((r.team==='imp'&&b.team!=='imp')?' (Hain)':'')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function autoSetup(n){
  const c={};const add=id=>{c[id]=(c[id]||0)+1};
  const imp=n<=5?1:n<=8?2:3;add('hain');if(imp>=2)add(shuffle(['temizlikci','suclayici','polis_h','gozcu_h','dedektif_h','tuzakci_h','izci_h'])[0]);if(imp>=3)add(shuffle(['hain','ispiyoncu_h','provokator_h','temizlikci'])[0]);
  let used=imp;if(n>=7){add(shuffle(['serikatil','serikatil','bombaci','hirsiz','buyucu','hortlak'])[0]);used++}if(n>=10){add('hayatta');used++}
  const inn=['doktor','polis',...shuffle(['gozcu','dedektif','tuzakci','deli','ispiyoncu','provokator','izci'])];
  for(let i=0;used<n;i++,used++)add(inn[i]||'masum');
  return c;
}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

let myLook=ls('kg_look')||{color:COLORS[Math.floor(Math.random()*COLORS.length)],hat:HATS[Math.floor(Math.random()*HATS.length)][0]};

let lobby=[];let local={act:{},vote:null};
let setupCounts=null,manualSetup=false,lastAutoN=0,settings=ls('kg_settings')||{night:30,talk:120,vote:45};
let timerIv=null,lastKey=null,lastPrivStr={},sel={},idRetry=0,skew=0,connStage='sunucu',connSince=Date.now();

function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

const qs=new URLSearchParams(location.search);
if(qs.get('oda')){joinRoom(qs.get('oda').toLowerCase().replace(/[^a-z0-9]/g,''))}else{render()}
function hostRoom(reuse){
  isHost=true;myId=uid;roomCode=(reuse&&ls('kg_room'))||genCode();ls('kg_room',roomCode);
  S=(reuse&&ls('kg_secret'))||{game:null};P=(reuse&&ls('kg_pub'))||lobbyState();
  if(!S.game||P.phase==='lobby'||P.phase==='end'){P=lobbyState();S.game=null}
  P.lobby=[];
  if(P.phase!=='lobby'){if(P.ends&&P.ends<Date.now()+10000)P.ends=Date.now()+20000;refreshPriv();startTimer()}
  render();openHostPeer();
}
function openHostPeer(){
  if(peer)peer.destroy();connected=false;
  peer=new Peer('kasaba-'+roomCode,Object.assign({debug:0},window.PEER_OPTS||{}));
  peer.on('open',()=>{connected=true;connErr=null;idRetry=0;collectLobby();pushState()});
  peer.on('connection',c=>{c.on('data',m=>onHostMsg(c,m));c.on('close',()=>{if(c.uid&&conns[c.uid]===c){delete conns[c.uid];collectLobby();pushState()}});c.on('error',()=>{})});
  peer.on('disconnected',()=>{connected=false;render();setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){if(idRetry++<5){setTimeout(openHostPeer,2000)}else{roomCode=genCode();ls('kg_room',roomCode);idRetry=0;openHostPeer()}return}
    if(e.type==='peer-unavailable')return;
    connErr='Bağlantı sorunu ('+e.type+'). Sayfayı yenilemeyi dene.';render();
  });
}
function joinRoom(code){
  isHost=false;myId=uid;roomCode=code;P={phase:'lobby',lobby:[],players:[],chat:[],dead:[]};render();
  peer=new Peer(Object.assign({debug:0},window.PEER_OPTS||{}));
  peer.on('open',()=>{connStage='host';render();connectHost()});
  peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){connErr='Oda bulunamadı. Ev sahibinin sayfası açık mı? 3 sn sonra tekrar denenecek.';render();setTimeout(connectHost,3000)}else{connErr='Bağlantı sorunu ('+e.type+').';render()}});
}
function connectHost(){
  if(!peer||peer.destroyed)return;
  if(hostConn){try{hostConn.close()}catch(e){}}
  hostConn=peer.connect('kasaba-'+roomCode,{reliable:true});
  hostConn.on('open',()=>{connected=true;connErr=null;connStage='ok';sendHello();render()});
  hostConn.on('iceStateChanged',st=>{if(st==='failed'||st==='disconnected'){connStage='ice';render()}});
  hostConn.on('data',m=>{
    if(m.t==='state'){const prev=P;P=m.P;if(m.now)skew=Date.now()-m.now;lobby=P.lobby||[];onStateChange(prev);render()}
    else if(m.t==='priv'){priv=m.d;render()}
  });
  hostConn.on('close',()=>{connected=false;render();setTimeout(connectHost,2000)});
  hostConn.on('error',()=>{});
}
function send(m){if(hostConn&&hostConn.open){try{hostConn.send(m)}catch(e){}}}
function sendHello(){if(!myName)return;if(isHost){collectLobby();pushState()}else send({t:'hello',uid:myId,name:myName,color:myLook.color,hat:myLook.hat})}
function collectLobby(){
  if(!isHost)return;
  lobby=[];if(myName)lobby.push({id:myId,name:myName,color:myLook.color,hat:myLook.hat});
  for(const [id,c] of Object.entries(conns))if(c.open&&names[id]&&id!==myId)lobby.push({id,name:names[id],color:(looks[id]||{}).color,hat:(looks[id]||{}).hat});
  // aynı rengi seçen iki kişi olursa ikinciye boş bir renk ver
  const used=new Set();lobby.forEach(p=>{if(!p.color||used.has(p.color))p.color=COLORS.find(c=>!used.has(c))||COLORS[0];used.add(p.color);if(!p.hat)p.hat='none'});
  P.lobby=lobby;
}
function onHostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){const id=String(m.uid||'').slice(0,20);if(!id)return;c.uid=id;conns[id]=c;names[id]=String(m.name||'').slice(0,16)||'Oyuncu';looks[id]={color:COLORS.includes(m.color)?m.color:null,hat:HATS.some(h=>h[0]===m.hat)?m.hat:'none'};collectLobby();lastPrivStr[id]=null;refreshPriv();pushState();return}
  const id=c.uid;if(!id||!S||!S.game)return;const player=pl(id);if(!player)return;
  if(m.t==='act'&&P.phase==='night'&&m.d===P.day&&player.alive){S.game.acts[id]={kill:m.kill||null,ab:m.ab||null,guess:m.guess||null,det:!!m.det}}
  else if(m.t==='vote'&&P.phase==='vote'&&m.d===P.day&&player.alive){S.game.votes[id]=m.v;P.voted=Object.keys(S.game.votes);pushState();checkAutoAdvance()}
  else if(m.t==='msg'&&player.alive&&(P.phase==='talk'||P.phase==='vote')){addChat(id,m.x);pushState()}
  else if(m.t==='dmsg'&&!player.alive){S.game.dchat.push({id,t:String(m.x).slice(0,240)});if(S.game.dchat.length>80)S.game.dchat.shift();refreshPriv()}
}
function pushSecret(){if(isHost)ls('kg_secret',S)}
let pendingPush=null;
function pushState(){
  if(!isHost)return;render();ls('kg_pub',P);
  if(pendingPush)return;pendingPush=setTimeout(()=>{pendingPush=null;const m={t:'state',P,now:Date.now()};for(const c of Object.values(conns))if(c.open){try{c.send(m)}catch(e){}}},80);
}
function refreshPriv(){
  if(!isHost||!S.game)return;priv=privPlainFor(myId)||priv;
  for(const [id,c] of Object.entries(conns)){if(!c.open||!pl(id))continue;const plain=privPlainFor(id);if(!plain)continue;const str=JSON.stringify(plain);if(lastPrivStr[id]===str)continue;lastPrivStr[id]=str;try{c.send({t:'priv',d:plain})}catch(e){}}
}

function submitAct(patch){Object.assign(local.act,patch,{d:P.day});if(isHost){S.game.acts[myId]={...local.act}}else send({t:'act',...local.act});render()}
function castVote(t){local.vote={d:P.day,t};if(isHost){S.game.votes[myId]=t;P.voted=Object.keys(S.game.votes);pushState();checkAutoAdvance()}else send({t:'vote',d:P.day,v:t});render()}
function sendMsg(text,kind){
  text=text.trim().slice(0,240);if(!text)return;
  if(isHost){
    if(kind==='dead'){S.game.dchat.push({id:myId,t:text});if(S.game.dchat.length>80)S.game.dchat.shift();refreshPriv()}
    else addChat(myId,text);
    pushState()}
  else send({t:kind==='dead'?'dmsg':'msg',x:text});
}
function alivePlayers(){return P.players.filter(p=>p.alive)}
function pl(id){return (P.players||[]).find(p=>p.id===id)}
function nameOf(id){const p=pl(id);return p?p.name:'?'}
function effKey(id){const r=S.game.roles[id];return r.mad?null:r.key}
function shownRole(id){const r=S.game.roles[id];return r.mad?{key:r.mad,team:'inn'}:{key:r.key,team:r.team}}

// ---------- Oyun akışı (ev sahibi) ----------
function startGame(){
  const players=lobby.slice(0,12);const total=Object.values(setupCounts).reduce((a,b)=>a+b,0);
  if(players.length<4||total!==players.length)return;
  const bag=[];for(const e of SETUP)for(let i=0;i<(setupCounts[e.id]||0);i++)bag.push({key:e.key,team:e.team});shuffle(bag);
  const roles={};players.forEach((p,i)=>{const r=bag[i];roles[p.id]={key:r.key,team:r.team,mad:r.key==='deli'?MADPOOL[Math.floor(Math.random()*MADPOOL.length)]:null,uses:{},vest:3,planted:[]}});
  S.game={roles,acts:{},notes:{},dchat:[],votes:{},provoke:null,blame:null,clean:null,candle:{},haunt:null,hauntWins:[]};
  players.forEach(p=>S.game.notes[p.id]=[]);
  const prev={phase:'lobby'};
  P={phase:'night',day:1,ends:Date.now()+settings.night*1000+6000,chat:[],dead:[],voted:[],settings,gameId:Date.now(),morning:null,evening:null,provoked:null,
     players:players.map(p=>({id:p.id,name:p.name,alive:true,color:p.color,hat:p.hat})),
     roleList:bag.map(r=>({n:roleLabel(r),team:r.team})).sort((a,b)=>a.team.localeCompare(b.team))};
  local={act:{},vote:null};lastPrivStr={};sel={};
  pushSecret();startTimer();refreshPriv();onStateChange(prev);pushState();
}
function startTimer(){clearInterval(timerIv);timerIv=setInterval(()=>{if(!isHost)return;if(P.ends&&Date.now()>=P.ends&&P.phase!=='end'&&P.phase!=='lobby')advance()},500)}
function setPhase(ph){
  const prev={phase:P.phase,day:P.day};
  P.phase=ph;S.game.votes={};P.voted=[];P.provoked=null;
  // sabah/akşam sahnelerine animasyon payı eklenir
  const extra=ph==='talk'?7:ph==='night'?6:0;
  const secs=ph==='night'?settings.night:ph==='talk'?settings.talk:settings.vote;
  P.ends=Date.now()+(secs+extra)*1000;
  if(ph==='night'){P.day++;S.game.acts={};local.act={};sel={}}
  if(ph==='vote'){local.vote=null;if(S.game.provoke&&S.game.provoke.day===P.day)P.provoked=S.game.provoke.t}
  if(ph!=='talk')P.morning=null;if(ph!=='night')P.evening=null;
  onStateChange(prev);
}
function advance(){
  if(P.phase==='night')resolveNight();
  else if(P.phase==='talk')setPhase('vote');
  else if(P.phase==='vote')resolveVote();
  refreshPriv();pushSecret();pushState();
}
function note(id,t){if(S.game.notes[id])S.game.notes[id].push('Gece '+P.day+': '+t)}
function checkAutoAdvance(){const al=alivePlayers();if(P.phase==='vote'&&al.every(p=>S.game.votes[p.id]!==undefined))advance()}
function addChat(id,t){t=String(t).slice(0,240);if(!t.trim())return;P.chat.push({id,t,d:P.day,ts:Date.now()});if(P.chat.length>150)P.chat.shift()}
function sysChat(t){P.chat.push({sys:true,t});if(P.chat.length>150)P.chat.shift()}

function resolveNight(){
  const g=S.game,acts={...g.acts};if(pl(myId)&&pl(myId).alive)acts[myId]={...local.act};
  const al=alivePlayers().map(p=>p.id);const alive=id=>pl(id)&&pl(id).alive;
  const blocked=new Set(),traps={},visits={},attacks=[],heals=new Set(),vested=new Set(),went={};
  al.forEach(id=>visits[id]=[]);
  // hainde öldürme ile yetenek aynı gece olmaz: öldürme seçildiyse yetenek düşer
  for(const id of al){const r=g.roles[id];if(r.team==='imp'&&acts[id]&&acts[id].kill)acts[id]={...acts[id],ab:null}}
  const A=id=>acts[id]||{};
  const tgt=(id,f)=>{const t=A(id)[f];return(t&&alive(t)&&t!==id)?t:null};
  const M={deaths:[],saved:[],snitch:[],lightning:[],exploded:[],haunted:[],news:[]};
  // 1) tuzaklar
  for(const id of al)if(effKey(id)==='tuzakci'&&tgt(id,'ab')){traps[tgt(id,'ab')]=id;went[id]=tgt(id,'ab')}
  // 2) polis (seri katili tutamaz)
  for(const id of al)if(effKey(id)==='polis'){const t=tgt(id,'ab');if(!t)continue;visits[t].push(id);went[id]=t;
    if(traps[t]&&traps[t]!==id){blocked.add(id);note(id,'Tuzağa yakalandın, kimseyi tutamadın.');note(traps[t],nameOf(id)+' tuzağına yakalandı.')}
    else if(effKey(t)==='serikatil'){note(id,nameOf(t)+' evde durmadı; onu tutamadın.')}
    else{blocked.add(t);note(id,nameOf(t)+' bu gece evden çıkamadı.');note(t,'Polis seni evde tuttu, rolünü kullanamadın.')}}
  // 3) ziyaretler ve tuzak yakalamaları (büyücü evinden çıkmaz)
  for(const id of al){if(effKey(id)==='polis'||effKey(id)==='tuzakci')continue;const k=effKey(id);const r=g.roles[id];const targets=new Set();
    if(r.team==='imp'&&tgt(id,'kill'))targets.add(tgt(id,'kill'));
    if(k&&ROLES[k].act==='other'&&k!=='buyucu'&&tgt(id,'ab'))targets.add(tgt(id,'ab'));
    if(r.mad&&tgt(id,'ab'))targets.add(tgt(id,'ab'));
    if(blocked.has(id))continue;
    for(const t of targets){visits[t].push(id);went[id]=t;if(traps[t]&&traps[t]!==id){blocked.add(id);note(id,nameOf(t)+' evinde tuzağa yakalandın, rolünü kullanamadın.');note(traps[t],nameOf(id)+' tuzağına yakalandı.')}}
  }
  const ok=id=>!blocked.has(id);
  // 4) koruma
  for(const id of al){const k=effKey(id);if(k==='doktor'&&ok(id)&&tgt(id,'ab'))heals.add(tgt(id,'ab'));
    if(k==='hayatta'&&A(id).ab==='self'&&g.roles[id].vest>0){g.roles[id].vest--;vested.add(id);note(id,'Yelek giydin (kalan '+g.roles[id].vest+').')}}
  // 5) saldırılar: her hain kendi başına
  for(const id of al){const k=effKey(id);const r=g.roles[id];if(!ok(id))continue;
    if(r.team==='imp'&&tgt(id,'kill'))attacks.push({v:tgt(id,'kill'),by:'Hain',ids:[id],cause:'stab'});
    if(k==='serikatil'&&tgt(id,'ab'))attacks.push({v:tgt(id,'ab'),by:'Seri Katil',ids:[id],cause:'stab'});
    if(k==='hirsiz'&&tgt(id,'ab'))attacks.push({v:tgt(id,'ab'),by:'Hırsız',ids:[id],thief:id,cause:'stab'});
    if(k==='bombaci'){if(tgt(id,'ab')){r.planted.push(tgt(id,'ab'));note(id,nameOf(tgt(id,'ab'))+' evine dinamit koydun.')}
      if(A(id).det){const hs=[...new Set(r.planted)].filter(alive);hs.forEach(v=>{attacks.push({v,by:'Bombacı',ids:[id],cause:'bomb'});M.exploded.push(v)});r.planted=[];note(id,hs.length?'Dinamitleri patlattın!':'Patlatacak dinamit yoktu.')}}
    if(k==='buyucu'&&tgt(id,'ab')&&A(id).guess&&ROLES[A(id).guess]){const t=tgt(id,'ab');const real=g.roles[t].key;
      if(A(id).guess===real){attacks.push({v:t,by:'Büyücü',ids:[id],cause:'bolt',sure:true});M.lightning.push(t);note(id,'Tahminin doğruydu: '+nameOf(t)+' = '+ROLES[real].n+'. Yıldırım gönderdin.')}
      else{attacks.push({v:id,by:'Büyü',ids:[],cause:'bolt',sure:true});M.lightning.push(id);note(id,'Tahminin yanlıştı ('+nameOf(t)+' '+ROLES[A(id).guess].n+' değil). Yıldırım sana döndü.')}}
  }
  // hortlak intikamı
  if(g.haunt&&g.haunt.night===P.day&&alive(g.haunt.t)){attacks.push({v:g.haunt.t,by:'Hortlak',ids:[],cause:'ghost',sure:true});M.haunted.push(g.haunt.t)}
  g.haunt=null;
  const died=[],causes={};
  for(const at of attacks){if(!alive(at.v)||died.includes(at.v)){at.ids.forEach(i=>note(i,nameOf(at.v)+' zaten ölmüştü.'));continue}
    if(!at.sure&&heals.has(at.v)){note(at.v,'Saldırıya uğradın ama Doktor seni kurtardı!');for(const id of al)if(effKey(id)==='doktor'&&tgt(id,'ab')===at.v)note(id,nameOf(at.v)+' saldırıya uğradı, onu kurtardın!');at.ids.forEach(i=>note(i,nameOf(at.v)+' saldırınızdan kurtuldu.'));if(!M.saved.includes(at.v))M.saved.push(at.v);continue}
    if(!at.sure&&vested.has(at.v)){note(at.v,'Saldırıya uğradın, yelek seni kurtardı.');at.ids.forEach(i=>note(i,nameOf(at.v)+' saldırınızdan kurtuldu.'));continue}
    died.push(at.v);causes[at.v]=at.cause;at.ids.forEach(i=>note(i,nameOf(at.v)+' öldürüldü.'));
    if(at.thief){const vr=g.roles[at.v];const nr=vr.mad?{key:'masum',team:'inn'}:{key:vr.key,team:vr.team};g.roles[at.thief].orig='hirsiz';g.roles[at.thief].key=nr.key;g.roles[at.thief].team=nr.team;g.roles[at.thief].uses={};note(at.thief,nameOf(at.v)+' rolünü çaldın: artık '+roleLabel(nr)+' olarak oynuyorsun.');causes[at.v]='vanish'}
  }
  // 6) bilgi rolleri
  for(const id of al){const r=g.roles[id];const k=effKey(id);const t=tgt(id,'ab');const bk=r.mad||k;if(!t||!bk)continue;
    if(k&&!ok(id))continue;
    if(bk==='polis'&&r.mad)note(id,nameOf(t)+' bu gece evden çıkamadı.');
    if(bk==='gozcu'){const n=r.mad?Math.floor(Math.random()*3):visits[t].length;note(id,nameOf(t)+' evine bu gece '+n+' kişi geldi.')}
    if(bk==='izci'){let w;if(r.mad){const o=al.filter(x=>x!==t&&x!==id);w=Math.random()<.4?null:o[Math.floor(Math.random()*o.length)]}else w=(blocked.has(t)?null:went[t])||null;note(id,w?nameOf(t)+' gece '+nameOf(w)+' evine gitti.':nameOf(t)+' gece evinden çıkmadı.')}
    if(bk==='dedektif'){const sk=r.mad?INVGROUPS[Math.floor(Math.random()*INVGROUPS.length)]:INVGROUPS.find(gp=>gp.includes(shownRole(t).key))||INVGROUPS[4];note(id,nameOf(t)+' şunlardan biri: '+sk.map(x=>ROLES[x].n).join(' / '))}
    if(bk==='ispiyoncu'&&!r.uses.ispiyoncu&&!died.includes(id)){r.uses.ispiyoncu=true;const sr=r.mad?{key:MADPOOL[Math.floor(Math.random()*MADPOOL.length)],team:'inn'}:shownRole(t);M.snitch.push({by:id,t,role:roleLabel(sr)});note(id,nameOf(t)+' rolünü sabah meydanda açıkladın.')}
    if(bk==='provokator'&&!r.uses.provokator){r.uses.provokator=true;if(r.mad)r.fakeProvoked={t,day:P.day};else g.provoke={t,day:P.day};note(id,nameOf(t)+' yarınki oylamaya 2 oyla başlayacak.')}
    if(k==='temizlikci'&&died.includes(t))g.clean=t;
    if(k==='suclayici')g.blame={t,day:P.day};
    if(k==='hortlak'){g.candle[id]=t;note(id,nameOf(t)+' kapısına mum koydun.')}
  }
  // 7) ölümler
  for(const v of died){pl(v).alive=false;let shown=roleLabel(shownRole(v));if(g.clean===v)shown='? (rolü gizlendi)';else if(g.blame&&g.blame.t===v)shown='Hain';P.dead.push({id:v,role:shown});M.deaths.push({id:v,role:shown,cause:causes[v]});M.news.push(causes[v]==='vanish'?'🎭 '+nameOf(v)+' kayboldu. Rolü: '+shown:'💀 '+nameOf(v)+' gece öldü. Rolü: '+shown)}
  M.saved=M.saved.filter(v=>!died.includes(v));M.saved.forEach(v=>M.news.push('🛡️ '+nameOf(v)+' saldırıya uğradı, Doktor kurtardı.'));
  M.snitch.forEach(s=>M.news.push('📣 '+nameOf(s.by)+' (İspiyoncu) açıkladı: '+nameOf(s.t)+' = '+s.role));
  if(!died.length&&!M.saved.length)M.news.push('🌅 Sakin bir gece. Kimse ölmedi.');
  g.clean=null;
  sysChat('— Gündüz '+P.day+' —');M.news.forEach(n=>sysChat(n));
  P.morning=M;
  if(checkWin())return;setPhase('talk');
}

function checkWin(){

  const pn=el('div','panel');pn.append(el('h2',null,'Nasıl oynanır'));
  pn.append(el('p','small','Küçük bir kasabada masumlar, hainler ve tarafsızlar birlikte yaşar. Gece herkes rolünü kullanır; gündüz olanlar konuşulur ve kasaba oylamayla birini gönderir. Masumlar bütün hainleri ve katilleri bulunca, hainler sayıca üstün gelince, tarafsız katiller tek kalınca kazanır. Oyun telefonda yatay oynanır.'));
  const roles=el('div','setup');SETUP.filter(e=>!e.id.endsWith('_h')).forEach(e=>{const r=el('div','r');const left=el('div');const n=el('div','n');const d=el('span','dot '+e.team);d.style.display='inline-block';d.style.marginRight='6px';n.append(d,document.createTextNode(ROLES[e.key].ico+' '+ROLES[e.key].n+' · '+TEAMN[e.team]));left.append(n,el('div','d',ROLES[e.key].desc));r.append(left);roles.append(r)});
  pn.append(roles,el('p','small muted','Polis, Gözcü, İzci, Dedektif, Tuzakçı, İspiyoncu ve Provokatör hain sürümüyle de oyuna girebilir; o zaman gece ya yeteneğini kullanır ya öldürür.'));return pn;
}
function lightPanel(pn){pn.style.background='transparent';pn.style.border='0';pn.style.padding='0';pn.querySelectorAll('.r').forEach(r=>{r.style.background='#f6efe0';r.querySelectorAll('.d').forEach(d=>d.style.color='#6b5c45')});pn.querySelectorAll('h2,h3,p,.n').forEach(x=>x.style.color='#3a2f1c');return pn}
function rulesOverlay(stage){const c=el('div','ov custom');c.style.maxHeight='88vh';c.style.overflow='auto';c.append(lightPanel(rulesPanel()));const b=el('button','primary','Kapat');b.onclick=()=>{ui.rules=false;render()};c.append(b);stage.append(c)}
function connPanel(t){const b=el('div','ov conn');b.append(el('p',null,t));const r=el('button',null,'Yeniden dene');r.style.marginTop='8px';r.onclick=()=>location.reload();b.append(r);return b}
function connectingPanel(){
  const b=el('div','ov conn');const wait=Math.round((Date.now()-connSince)/1000);
  b.append(el('p',null,connStage==='sunucu'?'Sinyal sunucusuna bağlanılıyor…':connStage==='ice'?'Ev sahibi bulundu ama doğrudan bağlantı kurulamadı, yeniden deneniyor…':'Ev sahibine bağlanılıyor… (oda: '+roomCode+')'));
  if(wait>=12){const ul=el('ul');
    const tips=connStage==='sunucu'?['İnternet bağlantını kontrol et.','Okul/iş ağı ya da VPN sinyal sunucusunu engelliyor olabilir; mobil veriyi dene.']
      :connStage==='ice'?['Telefon ile ev sahibi farklı ağlardaysa bazı operatörler doğrudan bağlantıyı engeller. İkiniz de aynı Wi-Fi\'ya ya da ikiniz de mobil veriye geçin.','VPN açıksa kapat.']
      :['Ev sahibinin sekmesi açık mı? Sekme kapanır ya da telefon kilitlenirse oda düşer.','Ev sahibi sayfayı yenilediyse yeni link göndermesi gerekebilir.','Ev sahibi kendi davet linkini açmamalı; o zaten odanın içinde.'];
    tips.forEach(t=>ul.append(el('li',null,t)));b.append(ul);const r=el('button',null,'Yeniden dene');r.style.marginTop='8px';r.onclick=()=>location.reload();b.append(r)}
  return b;
}
function gearMenu(stage,items){
  const g=el('button','ov gear','⚙️');g.onclick=()=>{ui.menu=!ui.menu;ui.notes=false;render()};stage.append(g);
  if(!ui.menu)return;const m=el('div','ov menu');items.forEach(it=>{if(it.h){m.append(el('div','h',it.h));return}if(it.node){m.append(it.node);return}const b=el('button',it.cls||'',it.t);b.onclick=()=>{it.on();render()};m.append(b)});stage.append(m);
}
function renderLobbyUI(stage){
  const n=(P.lobby||[]).length;
  if(!myName){const c=el('div','ov custom');c.append(el('h2',null,'Adın ne?'));const i=el('input');i.id='nameInput';i.placeholder='Adın';i.maxLength=16;const b=el('button','primary','Lobiye gir');
    b.onclick=()=>{myName=i.value.trim().slice(0,16);if(!myName)return;ls('kg_name',myName);sendHello();collectLobby();render()};i.onkeydown=e=>{if(e.key==='Enter')b.click()};c.append(i,b);stage.append(c);return}
  stage.append(el('div','ov count pill','👥 '+n+' / 12 oyuncu · en az 4'));
  if(isHost){const lb=el('div','ov lobbybar');lb.append(document.createTextNode('Davet linki '));const code=el('code',null,inviteLink());const cb=el('button',null,'Linki kopyala');
    cb.onclick=()=>{navigator.clipboard.writeText(inviteLink()).then(()=>{cb.textContent='Kopyalandı ✓';setTimeout(()=>{cb.textContent='Linki kopyala'},1500)}).catch(()=>{prompt('Linki kopyala:',inviteLink())})};lb.append(code,cb);stage.append(lb)}
  else if(!ui.custom)stage.append(el('div','ov hint','Ev sahibinin oyunu başlatması bekleniyor… Karakterine dokunup rengini ve şapkanı değiştirebilirsin.'));
  if(isHost){
    const nn=Math.max(4,n);if(!setupCounts||(!manualSetup&&lastAutoN!==nn)){setupCounts=autoSetup(nn);lastAutoN=nn}
    const total=Object.values(setupCounts).reduce((a,b)=>a+b,0);
    const items=[{h:'SÜRELER (saniye)'}];
    [['night','Gece'],['talk','Tartışma'],['vote','Oylama']].forEach(([k,l])=>{const lab=el('label',null,l);const i=el('input');i.type='number';i.min=15;i.max=600;i.value=settings[k];i.onchange=()=>{settings[k]=Math.max(15,Math.min(600,+i.value||30));ls('kg_settings',settings)};lab.append(i);items.push({node:lab})});
    items.push({h:'ROLLER ('+total+' / '+n+')'});
    const chips=el('div','row');chips.style.padding='4px 10px';SETUP.forEach(e=>{for(let i=0;i<(setupCounts[e.id]||0);i++){const c=el('div','chip');c.style.color='#3a2f1c';c.style.background='#f6efe0';c.style.borderColor='#d9c9a6';c.append(el('span','dot '+e.team),document.createTextNode(roleLabel(e)));chips.append(c)}});items.push({node:chips});
    items.push({t:'🎲 Rolleri yeniden karıştır',on:()=>{setupCounts=autoSetup(nn);manualSetup=false;lastAutoN=nn}});
    items.push({t:manualSetup?'Elle ayarı kapat':'Gelişmiş: rolleri elle ayarla',on:()=>{manualSetup=!manualSetup;if(!manualSetup){setupCounts=autoSetup(nn);lastAutoN=nn}}});
    if(manualSetup){const su=el('div','setup');su.style.padding='0 6px';SETUP.forEach(e=>{const r=el('div','r');r.style.background='#f6efe0';const left=el('div');const nm=el('div','n');nm.style.color='#3a2f1c';const d=el('span','dot '+e.team);d.style.display='inline-block';d.style.marginRight='6px';nm.append(d,document.createTextNode(roleLabel(e)));left.append(nm);
      const stp=el('div','row');const m=el('button',null,'−');const v=el('span',null,String(setupCounts[e.id]||0));v.style.minWidth='2ch';v.style.textAlign='center';const pb=el('button',null,'+');[m,pb].forEach(x=>{x.style.background='#fff';x.style.border='1px solid #d9c9a6';x.style.padding='2px 10px'});
      m.onclick=()=>{setupCounts[e.id]=Math.max(0,(setupCounts[e.id]||0)-1);render()};pb.onclick=()=>{setupCounts[e.id]=(setupCounts[e.id]||0)+1;render()};stp.append(m,v,pb);r.append(left,stp);su.append(r)});items.push({node:su})}
    items.push({h:'ODA'},{t:'📖 Nasıl oynanır',on:()=>{ui.rules=!ui.rules}},{t:'✖ Odayı kapat',cls:'d',on:()=>{location.search=''}});
    gearMenu(stage,items);
    const st=el('button','ov start','Oyunu başlat');st.disabled=!(n>=4&&n<=12&&total===n);st.onclick=()=>startGame();stage.append(st);
    if(!ui.custom&&!ui.menu){if(n<4)stage.append(el('div','ov hint','Başlamak için en az 4 oyuncu gerekir. Linki gönder; açan herkes meydana gelir.'));
      else if(total!==n)stage.append(el('div','ov hint','Rol sayısı oyuncu sayısına eşit olmalı (⚙️ menüsünden düzelt).'));
      else stage.append(el('div','ov hint','Herkes geldiyse başlat. Roller ve süreler ⚙️ menüsünde; karakterine dokunarak rengini değiştir.'))}
  }else gearMenu(stage,[{t:'📖 Nasıl oynanır',on:()=>{ui.rules=!ui.rules}},{t:'✖ Odadan çık',cls:'d',on:()=>{location.search=''}}]);
  if(ui.rules)rulesOverlay(stage);
  if(ui.custom){const c=el('div','ov custom');c.append(el('h2',null,'Karakterin'));
    const nm=el('input');nm.id='nameEdit';nm.value=myName;nm.maxLength=16;nm.onchange=()=>{const v=nm.value.trim().slice(0,16);if(v){myName=v;ls('kg_name',myName);sendHello()}};c.append(nm);
    const sw=el('div','sw');COLORS.forEach(col=>{const b=el('button',myLook.color===col?'on':'');b.style.background=col;b.onclick=()=>{myLook.color=col;ls('kg_look',myLook);sendHello();render()};sw.append(b)});c.append(el('div','small',"Renk"),sw);
    const hats=el('div','row hats');HATS.forEach(([k,l])=>{const b=el('button',myLook.hat===k?'on':'',l);b.onclick=()=>{myLook.hat=k;ls('kg_look',myLook);sendHello();render()};hats.append(b)});c.append(el('div','small','Şapka / aksesuar'),hats);
    const ok=el('button','primary','Tamam');ok.onclick=()=>{ui.custom=false;render()};c.append(ok);stage.append(c)}
}
function fmtTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderGameUI(stage){
  const me=pl(myId);const alive=!!(me&&me.alive);const night=P.phase==='night';const a=age();
  // rol çubuğu
  const rb=el('div','ov rolebar');const known={};
  if(priv.role)known[myId]=priv.role.ico;P.dead.forEach(d=>{const k=Object.keys(ROLES).find(k=>d.role.startsWith(ROLES[k].n));known[d.id]=k?ROLES[k].ico:'💀'});(priv.mates||[]).forEach(id=>{if(!known[id])known[id]='🗡️'});
  P.players.forEach(p=>{const d=el('div','r',known[p.id]||'?');d.title=p.name+(known[p.id]?'':' · bilinmiyor');if(known[p.id]){const i=el('i');i.style.background=p.color;d.append(i)}rb.append(d)});stage.append(rb);
  // sayaç
  const tm=el('div','ov timerbox');tm.append(el('span','timer',P.ends?fmtTime(P.ends-now()):'—'),el('span',null,night?'🌙':'☀️'),el('small',null,night?'GECE '+P.day:P.phase==='talk'?'GÜNDÜZ '+P.day:'GİZLİ OY · '+(P.voted||[]).length+'/'+alivePlayers().length));stage.append(tm);
  // menü
  const items=[{t:'🃏 Rolümü göster',on:()=>{ui.roleCard=true}},{t:'📖 Nasıl oynanır',on:()=>{ui.rules=!ui.rules}}];
  if(isHost)items.push({h:'EV SAHİBİ'},{t:'✖ Oyunu iptal et',cls:'d',on:()=>{if(confirm('Oyun iptal edilsin mi?'))endToLobby()}});
  else items.push({t:'✖ Odadan çık',cls:'d',on:()=>{if(confirm('Odadan çıkılsın mı?'))location.search=''}});
  gearMenu(stage,items);
  if(ui.rules)rulesOverlay(stage);
  // üst kutu: sabah / akşam
  let box=null;
  if(anim.seq==='morning'&&P.morning&&a<7){box=el('div','ov box');P.morning.news.forEach((n,i)=>box.append(el('div',i===0?'t':'',n)))}
  else if(anim.seq==='evening'&&a<4.5&&P.evening){box=el('div','ov box');box.append(el('div','t',P.evening.out?'⚖️ Kasaba '+nameOf(P.evening.out.id)+' kişisini gönderdi · Rolü: '+P.evening.out.role:'⚖️ Oylar yetersiz, kimse gönderilmedi'));if(P.evening.summary)box.append(el('div',null,'Oylar: '+P.evening.summary))}
  else if(anim.seq==='evening'&&a<4.5&&P.day===1){box=el('div','ov box');box.append(el('div','t','🌙 Gece 1 başlıyor… herkes evine'))}
  if(box)stage.append(box);
  else{const hint=!me?'Bu oyuna oyuncu olarak dahil değilsin; izliyorsun.':!alive?'Öldün. Kasabayı izliyorsun; ölülerle konuşabilirsin.':night?(priv.role&&canTarget()?(myRoleKey()==='buyucu'?'Bir ev seç, sonra rolünü tahmin et. Evinden çıkmazsın.':'Bir eve dokun; karakterin oraya gider. Bunu sadece sen görürsün. Süre dolunca gece biter.'):'Bu gece yapacağın bir şey yok; evde kal.'):P.phase==='talk'?'Konuşun: kim şüpheli?':'Göndermek istediğin evi seç · oylar gizli, sonunda sadece toplamlar açıklanır';stage.append(el('div','ov hint',hint))}
  // rol kartı (ilk gece büyük, sonra sağ altta küçük)
  if(me&&priv.role){
    if(ui.roleCard&&!(anim.seq==='evening'&&P.day===1&&a<5)){const c=el('div','ov box center');c.style.borderColor='var(--'+priv.role.team+')';c.append(el('div','small',TEAMN[priv.role.team].toUpperCase()));const ic=el('div',null,priv.role.ico);ic.style.fontSize='44px';c.append(ic,el('div','t',priv.role.label),el('div',null,priv.role.desc));
      if(priv.mates&&priv.mates.length)c.append(el('div','small','Hain arkadaşların: '+priv.mates.map(nameOf).join(', ')));const ok=el('button','ok','Anladım');ok.onclick=()=>{ui.roleCard=false;render()};c.append(ok);stage.append(c)}
    const m=el('button','ov mine');m.append(el('span','ic',alive?priv.role.ico:'💀'));const t=el('div');const tt=el('span','team',alive?TEAMN[priv.role.team]:'ÖLDÜN');tt.style.color=alive?'var(--'+priv.role.team+')':'#7a6a55';t.append(tt,el('b',null,priv.role.label));m.append(t);m.onclick=()=>{ui.roleCard=true;render()};stage.append(m);
    const nb=el('button','ov notesbtn','📒 Notlar'+((priv.notes||[]).length?' ('+priv.notes.length+')':'')+(ui.notes?' ▴':' ▾'));nb.onclick=()=>{ui.notes=!ui.notes;ui.menu=false;render()};stage.append(nb);
    if(ui.notes){const n=el('div','ov notes');n.append(el('div','h','📒 NOTLARIN (sadece sen)'));(priv.notes||[]).slice(-30).forEach(x=>n.append(el('div','n',x)));if(!priv.notes||!priv.notes.length)n.append(el('div','n','Henüz not yok.'));stage.append(n)}
  }
  // gece eylem düğmeleri
  if(alive&&night&&priv.role&&a>2.5&&!ui.roleCard){
    ensureMode();const modes=modesFor();const k=priv.role.key;const act=el('div','ov act');
    modes.forEach(([m,l,dis])=>{const b=el('button',(m==='ab'?'ab':'')+(sel.mode===m?' on':''),l+(local.act[m]&&local.act[m]!=='self'?' → '+nameOf(local.act[m]):''));b.disabled=!!dis;b.onclick=()=>{sel.mode=m;render()};act.append(b)});
    if(k==='hayatta'){const b=el('button',local.act.ab==='self'?'ab on':'','🦺 Yelek giy (kalan '+(priv.vest??3)+')');b.disabled=!(priv.vest>0);b.onclick=()=>submitAct({ab:local.act.ab==='self'?null:'self'});act.append(b)}
    if(k==='bombaci'){const b=el('button',local.act.det?'on':'','🧨 Hepsini patlat ('+(priv.planted||0)+' dinamit)');b.onclick=()=>submitAct({det:!local.act.det});act.append(b)}
    if(sel.mode&&local.act[sel.mode]&&local.act[sel.mode]!=='self'){const b=el('button',null,'↩︎ Vazgeç');b.onclick=()=>{submitAct({[sel.mode]:null,guess:null});anim.enteredAt=null};act.append(b)}
    if(!modes.length&&k!=='hayatta')act.append(el('span','pill','Bu gece yapacağın bir şey yok.'));
    stage.append(act);
    if(k==='buyucu'&&local.act.ab){const gp=el('div','ov guess');gp.append(el('div','small',nameOf(local.act.ab)+' sence hangi rol?'));const row=el('div','row');
      Object.keys(ROLES).filter(x=>x!=='deli').forEach(x=>{const b=el('button',local.act.guess===x?'on':'',ROLES[x].n);b.onclick=()=>submitAct({guess:x});row.append(b)});gp.append(row);stage.append(gp)}
  }
  // oylama: atla
  if(alive&&P.phase==='vote'&&a>1){const sk=el('button','ov skip'+(local.vote&&local.vote.t==='skip'?' on':''),'Atla (çekimser)');sk.onclick=()=>castVote('skip');stage.append(sk)}
  // sohbet (gündüz herkes; ölüler her zaman kendi aralarında)
  const isDead=me&&!alive;const msgs=isDead?(priv.dchat||[]).map(m=>({...m,dead:true})):(P.chat||[]);
  if(!(night&&!isDead)){
    const chatBox=el('div','ov chat');const log=el('div','log');
    msgs.slice(-60).forEach(m=>{const d=el('div',m.sys?'sys':m.dead?'dead':'');if(!m.sys){const b=el('b');b.style.background=(pl(m.id)||{}).color||'#999';d.append(b)}d.append(document.createTextNode(m.sys?m.t:nameOf(m.id)+': '+m.t));log.append(d)});
    chatBox.append(log);
    if(me&&(isDead||alive)){const r=el('div','in');const i=el('input');i.id='chatInput';i.placeholder=isDead?'👻 Ölülere yaz…':'Mesaj yaz…';i.maxLength=240;const b=el('button',null,'Gönder');b.onclick=()=>{sendMsg(i.value,isDead?'dead':'town');i.value='';i.focus()};i.onkeydown=e=>{if(e.key==='Enter')b.click()};r.append(i,b);chatBox.append(r)}
    stage.append(chatBox);queueMicrotask(()=>{log.scrollTop=log.scrollHeight});
  }
}
function renderEndUI(stage){
  const a=age();
  if(P.morning&&a<7){const box=el('div','ov box');P.morning.news.forEach((n,i)=>box.append(el('div',i===0?'t':'',n)));stage.append(box);return}
  if(P.evening&&!P.morning&&a<5){const box=el('div','ov box');box.append(el('div','t',P.evening.out?'⚖️ Kasaba '+nameOf(P.evening.out.id)+' kişisini gönderdi · Rolü: '+P.evening.out.role:'⚖️ Oylar yetersiz, kimse gönderilmedi'));stage.append(box);return}
  const c=el('div','ov endcard');const w=el('div','w',P.winner?P.winner.t:'Oyun bitti');if(P.winner&&P.winner.team)w.style.color='var(--'+P.winner.team+')';c.append(w);
  const extras=[];if(P.winner&&P.winner.survivors&&P.winner.survivors.length)extras.push('Hayatta Kalan da kazandı: '+P.winner.survivors.join(', '));if(P.winner&&P.winner.haunters&&P.winner.haunters.length)extras.push('Hortlak da kazandı: '+P.winner.haunters.join(', '));
  extras.forEach(t=>c.append(el('p','small',t)));
  const rl=el('div','roll');(P.reveal||[]).forEach(r=>{const d=el('div');d.append(el('span',null,(r.alive?'🙂 ':'💀 ')+r.name));d.append(el('span','tag '+r.team,r.role));rl.append(d)});c.append(rl);
  if(isHost){const b=el('button','ok','Yeni oyun (lobiye dön)');b.onclick=()=>endToLobby();c.append(b)}else c.append(el('p','small','Ev sahibi yeni oyun başlatabilir.'));
  stage.append(c);
}
setInterval(()=>{if(P.ends&&P.phase!=='lobby'&&P.phase!=='end'&&P.phase!=='landing'){const t=document.querySelector('.timer');if(t)t.textContent=fmtTime(P.ends-now())}},1000);
setInterval(()=>{if(!isHost&&!connected&&!connErr&&roomCode)render()},3000);
setInterval(()=>{if(P.phase==='talk'||P.phase==='vote')render()},2500); // konuşma balonları ve ufak güncellemeler
</script>
