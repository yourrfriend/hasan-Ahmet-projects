<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasaba Gecesi — Profilim</title>
<link rel="stylesheet" href="/sayfa/ortak.css?v=__V__"><script src="/sunucu/game.js?v=__V__"></script><script src="/sayfa/evler.js?v=__V__"></script><script src="/sayfa/ortak.js?v=__V__"></script>
<style>
.ozet{display:flex;gap:10px;flex-wrap:wrap}.ozet .kart{flex:1;min-width:110px;text-align:center;padding:8px;border-radius:10px;background:#f6f1e6}.ozet .kart b{display:block;font-size:22px}
.rozet{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:4px 10px;border-radius:999px;background:#fff3c4;font-size:13px}.rozet.kilitli{background:#eee;color:#999;filter:grayscale(1)}
.urun{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}.urun .ad{flex:1}.urun .nadir{font-size:11px;color:#8a7a5a}
.urun svg.onizleme,.urun img.onizleme{width:58px;height:46px;flex:none}.urun.efsanevi .nadir{color:#b8860b;font-weight:800}.urun.nadir .nadir{color:#4b2299}.urun button{padding:4px 10px;border-radius:8px;border:0;background:#1e3a8a;color:#fff;font-weight:700}
.urun button.giyili{background:#2fb55a}.urun button:disabled{opacity:.5}.yildiz{font-size:20px;font-weight:800}
</style></head>
<body><main><a class="geri" href="/">← Kasaba Gecesi</a><h1>Profilim</h1><div id="icerik" class="panel"><p class="muted">Yükleniyor…</p></div></main>
<script>
// /ben: kişisel sayfa (ilerleme). Veri yalnız kendi satırların (RLS); satın alma sunucudan (/ben/al, fiyat sunucu katalogunda),
// "giy" ve "yanına al" bu cihazın seçimidir (localStorage kg_look; oyun sayfası aynı origin). Tasarım: …2026-10-26-kasaba-gecesi-ilerleme-esya-design.md
(async()=>{
  const {el,not}=KG_SAYFA;const G=window.KG_GAME;const icerik=document.getElementById('icerik');
  const {ayar,sb,session,neden}=await KG_SAYFA.oturum();
  if(!sb||!session){not(neden==='kayit-kapali'?'Kayıt kapalı: bu kurulumda ilerleme tutulmuyor.':'Bu cihazda kimlik yok: önce oyun sayfasını aç, sonra buraya dön.',neden==='kayit-kapali'?'':'hata');icerik.textContent='';return}
  const oku=async(q)=>{const {data,error}=await q;if(error)throw new Error(error.message||error.code);return data||[]};
  let ozet,cuzdan,esyalar,kozmetikler,rozetler;
  try{[ozet,cuzdan,esyalar,kozmetikler,rozetler]=await Promise.all([
    oku(sb.from('oyuncu_ozet').select('oyun,kazanma,en_cok_rol').eq('kurulum',ayar.kurulum||'')),
    oku(sb.from('cuzdan').select('yildiz')),oku(sb.from('esyalar').select('key,adet')),
    oku(sb.from('kozmetikler').select('key')),oku(sb.from('rozetler').select('key,kazanma'))])}
  catch(e){not('Bağlantı hatası, sayfayı yenile. ('+e.message+')','hata');icerik.textContent='';return}
  let yildiz=(cuzdan[0]&&cuzdan[0].yildiz)||0;const sahip=new Set(kozmetikler.map(k=>k.key));const kazanilan=new Set(rozetler.map(r=>r.key));
  const look=()=>{try{return JSON.parse(localStorage.getItem('kg_look'))||{}}catch(e){return {}}};
  const giy=(alan,deger)=>{const l=look();l[alan]=deger;localStorage.setItem('kg_look',JSON.stringify(l))};
  const NADIR={siradan:'Sıradan',nadir:'Nadir',efsanevi:'Efsanevi'};
  icerik.textContent='';
  // hesap güvenliği (yıldız ekonomisi 1): bağlı değilse kart ve satın almadan sonra hatırlatma; bağlıysa ödül bir kez istenir (karar veritabanında)
  const bagli=!!(session.user&&session.user.email);
  let aldi=false;try{aldi=sessionStorage.getItem('kg_ben_aldi')==='1';sessionStorage.removeItem('kg_ben_aldi')}catch(e){}
  if(!bagli){const g=el('div','panel guvenlik');g.append(el('h2',null,'🔒 Hesabın bu tarayıcıda'));
    if(aldi)g.append(el('p','hatirlat-satin','⭐ '+yildiz+' yıldızın yalnız bu tarayıcıda. E-postanı bağla, kaybolmasın.'));
    g.append(el('p','small','Oyna ✓ · Yıldız kazan '+(yildiz>0?'✓':'☐')+' · E-posta bağla ☐'));
    const a=el('a',null,'E-posta bağla → +'+G.YILDIZ_KAYNAK.bagla.adet+' ⭐ ve ✉️ Mühürlü mektup bayrağı');a.href='/?bagla=1';g.append(a);icerik.append(g)}
  else{let iste=true;try{iste=localStorage.getItem('kg_bagla_odul')!==session.user.id}catch(e){}
    if(iste)fetch('/hesap/bagla-odulu',{method:'POST',headers:{Authorization:'Bearer '+session.access_token}}).then(async r=>{if(!r.ok)return;const j=await r.json();try{localStorage.setItem('kg_bagla_odul',session.user.id)}catch(e){}
      if(j&&j.ok){not('✉️ Hesabın güvende! +'+G.YILDIZ_KAYNAK.bagla.adet+' ⭐ ve Mühürlü mektup bayrağı');const y=document.getElementById('yildiz');if(y)y.firstChild.textContent='⭐ '+j.yildiz}}).catch(()=>{})}
  // özet
  const p1=el('div','panel');p1.append(el('h2',null,'Özet'));const oz=el('div','ozet');const o=ozet[0]||{oyun:0,kazanma:0};
  const kart=(b,t)=>{const k=el('div','kart');k.append(el('b',null,String(b)),el('span','small muted',t));return k};
  oz.append(kart(o.oyun,'maç'),kart(o.kazanma,'kazanma'),kart(o.en_cok_rol&&G.ROLES[o.en_cok_rol]?G.ROLES[o.en_cok_rol].n:'—','en çok rol'));
  const yk=kart('⭐ '+yildiz,'yıldız');yk.querySelector('b').id='yildiz';oz.append(yk);p1.append(oz);icerik.append(p1);
  // eşyalar
  const p2=el('div','panel');p2.append(el('h2',null,'Eşyaların'));p2.append(el('p','small muted','Eşya modunda maç başında yanına bir tane alırsın; kullanırsan harcanır, kullanmadan ölürsen geri döner.'));
  const elde=esyalar.filter(e=>e.adet>0&&G.ESYA[e.key]);if(!elde.length)p2.append(el('p','muted','Henüz eşyan yok; maç sonu kasalarından çıkar.'));
  for(const e of elde){const E=G.ESYA[e.key];const r=el('div','urun');r.append(el('span','ad',E.ico+' '+E.n+' ×'+e.adet),el('span','small muted',E.desc));
    const b=el('button',look().esya===e.key?'giyili':'',look().esya===e.key?'Yanında ✓':'Yanına al');b.onclick=()=>{giy('esya',e.key);location.reload()};r.append(b);p2.append(r)}
  if(elde.length){const r=el('div','urun');r.append(el('span','ad','🎲 Rastgele'),el('span','small muted','Seçim yapma; maç başında bedava havuzdan rastgele bir eşya al.'));
    const secili=!look().esya;const b=el('button',secili?'giyili':'',secili?'Rastgele ✓':'Rastgele al');b.onclick=()=>{const l=look();delete l.esya;localStorage.setItem('kg_look',JSON.stringify(l));location.reload()};r.append(b);p2.append(r)}
  icerik.append(p2);
  // rozetler
  const p3=el('div','panel');p3.append(el('h2',null,'Rozetler ('+kazanilan.size+'/'+Object.keys(G.ROZETLER).length+')'));
  for(const [k,R] of Object.entries(G.ROZETLER)){const s=el('span','rozet'+(kazanilan.has(k)?'':' kilitli'),R.ico+' '+R.n);s.title=R.desc;p3.append(s)}
  icerik.append(p3);
  // koleksiyon + dükkân + dolap
  const p4=el('div','panel');p4.append(el('h2',null,'Koleksiyon ve dükkân'));p4.append(el('p','small muted','Kasadan çıkanlar ya da yıldızla aldıkların. "Giy" bu cihazdaki görünüşünü değiştirir; maçta herkes görür.'));
  const BASLIK={sapka:'Şapkalar',bayrak:'Ev bayrakları',efekt:'Ölüm efektleri',ev:'Evler'},ALAN={sapka:'hat',bayrak:'bayrak',efekt:'efekt',ev:'ev'};
  // ev önizlemesi: oyundaki çizimin küçüğü (SVG) ya da kullanıcı resmi
  const NS='http://www.w3.org/2000/svg';const SE=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
  // SVG önizleme ekrana gelince çizilir (99 evin hepsini açılışta çizmek zayıf telefonda yavaş)
  const gozcu='IntersectionObserver' in window?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){gozcu.unobserve(e.target);e.target._ciz()}},{rootMargin:'200px'}):null;
  const onizleme=k=>{const m=window.KG_EVLER&&KG_EVLER.model(k,'__V__');if(!m)return null;if(m.resim){const i=el('img','onizleme');i.src=m.resim;i.alt='';i.loading='lazy';return i}
    const svg=SE('svg',{class:'onizleme',viewBox:'-90 -140 190 190'});svg._ciz=()=>{if(!svg.firstChild)m.ciz(SE('g',{},svg),SE)};if(gozcu)gozcu.observe(svg);else svg._ciz();return svg};
  for(const [tur,liste] of Object.entries(G.KOZMETIK)){p4.append(el('h3',null,BASLIK[tur]));
    for(const [k,v] of Object.entries(liste)){const key=tur+':'+k;const r=el('div','urun '+v.nadir);r.dataset.key=key;if(tur==='ev'){const o=onizleme(k);if(o)r.append(o)}r.append(el('span','ad',v.n),el('span','nadir',NADIR[v.nadir]));
      if(sahip.has(key)){const giyili=look()[ALAN[tur]]===k;const b=el('button',giyili?'giyili':'',giyili?'Giyili ✓':'Giy');b.onclick=()=>{giy(ALAN[tur],giyili?'none':k);location.reload()};r.append(b)}
      else if(v.ozel)r.append(el('span','small muted','✉️ E-postanı bağlayınca'));
      else{const fiyat=G.NADIRLIK[v.nadir].fiyat;const b=el('button',null,'Al · ⭐ '+fiyat);b.disabled=yildiz<fiyat;
        b.onclick=async()=>{b.disabled=true;try{const {data}=await sb.auth.getSession();const tok=data&&data.session&&data.session.access_token;
          const res=await fetch('/ben/al',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({key})});const j=await res.json().catch(()=>({}));
          if(res.ok){yildiz=j.yildiz;try{sessionStorage.setItem('kg_ben_aldi','1')}catch(e){}location.reload()}else{not(j.error==='yildiz'?'Yıldızın yetmiyor.':j.error==='var'?'Bu zaten sende.':'Alınamadı, sonra tekrar dene.','hata');b.disabled=false}}
          catch(e){not('Alınamadı: '+e.message,'hata');b.disabled=false}};r.append(b)}
      p4.append(r)}}
  icerik.append(p4);
})().catch(e=>{KG_SAYFA.not('Bir şey ters gitti: '+e.message,'hata')});
</script></body></html>
